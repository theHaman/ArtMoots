<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ArtMoots - Posts</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<style>

/* =========================
   ROOT
========================= */

:root{

  --bg:#f7f7f7;
  --text:#111;
  --muted:#666;
  --purple:#caa6ff;

}

*{

  margin:0;
  padding:0;
  box-sizing:border-box;

}

body{

  font-family:"Inter",sans-serif;

  background:var(--bg);

  color:var(--text);

  overflow-x:hidden;

}

/* =========================
   HEADER
========================= */

header{

  width:100%;

  padding:1rem;

  display:flex;
  justify-content:center;

}

.header-container{

  width:100%;

  display:flex;
  align-items:center;
  gap:1rem;

}

/* LOGO */

.logo{

  width:140px;
  height:42px;

  background:#d9d9d9;

  border-radius:2px;

  flex-shrink:0;

}

/* SEARCH */

.search-bar{

  flex:1;

  height:42px;

  border:1px solid #444;

  border-radius:999px;

  background:white;

  display:flex;
  align-items:center;

  padding:0 1rem;

  gap:0.8rem;

}

.search-bar input{

  border:none;
  outline:none;

  width:100%;

  background:transparent;

  font-size:1rem;

}

.search-icon img{

  width:20px;
  height:20px;

  object-fit:contain;

}
.icon img{
  width:80px;
  height:80px;
  object-fit:contain;
}


/* NAV */

nav{

  display:flex;
  align-items:center;
  gap:1.5rem;

  margin-left:auto;

}

nav a{

  text-decoration:none;

  color:#111;

  font-size:0.95rem;
  font-weight:500;

}

.nav-circle{

  width:16px;
  height:16px;

  background:#bfbfbf;

  border-radius:50%;

}

/* =========================
   HERO
========================= */

.hero{

  margin:0 1rem;

  height:280px;

  border-radius:0 0 18px 18px;

  background:
    linear-gradient(
      90deg,
      #dff5ff 0%,
      #f6f6f6 30%,
      #f6f6f6 70%,
      #dff5ff 100%
    );

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

}

.hero-content h1{

  font-size:4rem;

  line-height:0.95;

  font-weight:500;

  margin-bottom:1rem;

}

.hero-content p{

  color:#444;

  font-size:1rem;

}

/* =========================
   MAIN
========================= */

main{

  padding:2rem 1rem 5rem;

}

/* =========================
   CREATE POST
========================= */

#createPost{

  background:white;

  padding:1.5rem;

  border-radius:22px;

  margin-bottom:2rem;

  box-shadow:
    0 10px 20px rgba(0,0,0,0.05);

}

#createPost h2{

  margin-bottom:1rem;

}

#createPost input,
#createPost textarea{

  width:100%;

  border:none;

  background:#f2f2f2;

  padding:1rem;

  border-radius:14px;

  margin-bottom:1rem;

  font-family:inherit;

}

#createPost textarea{

  min-height:120px;

  resize:vertical;

}

#createPost button{

  border:none;

  background:black;

  color:white;

  padding:1rem 1.3rem;

  border-radius:14px;

  cursor:pointer;

  font-weight:600;

}

/* =========================
   POSTS
========================= */

.posts-container{

  columns:3 320px;

  column-gap:1rem;

}

.post{

  break-inside:avoid;

  background:white;

  border-radius:22px;

  overflow:hidden;

  margin-bottom:1rem;

  box-shadow:
    0 10px 25px rgba(0,0,0,0.06);

  transition:0.25s;

}

.post:hover{

  transform:translateY(-4px);

}

.post img{

  width:100%;

  display:block;

}

.post-content{

  padding:1rem;

}

.post-content h3{

  margin-bottom:0.7rem;

}

.post-content p{

  color:#666;

  line-height:1.7;

  margin-bottom:1rem;

}

.post-meta{

  display:flex;
  gap:1rem;

  margin-bottom:1rem;

  color:#555;

}

.post button{

  border:none;

  background:#111;

  color:white;

  padding:0.8rem 1rem;

  border-radius:12px;

  cursor:pointer;

}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:700px){

  nav{

    display:none;

  }

  .hero-content h1{

    font-size:2.7rem;

  }

}

</style>
</head>
<body>

<!-- HEADER -->

<header>

  <div class="header-container">

    <div class="logo"></div>

    <div class="search-bar">

      <div class="search-icon">

        <img src="img/search-icon-png-1.png">

      </div>

      <input type="text"
             placeholder="Search artwork, artists...">

    </div>

    <nav>

      <a href="index.html">
        Home
      </a>

      <a href="posts.html">
        Gallery
      </a>

      <a href="#">
        About
      </a>

      <div class="nav-circle"></div>
      <div class="nav-circle"></div>

    </nav>

  </div>

</header>

<!-- HERO -->

<section class="hero">

  <div class="hero-content">

    <h1>
      Explore Art
    </h1>

    <p>
      Discover artwork from the ArtMoots community.
    </p>

  </div>

</section>

<!-- MAIN -->

<main>

  <!-- CREATE POST -->

  <form id="createPost">

    <h2>
      Create a Post
    </h2>

    <input type="text"
           id="postTitle"
           placeholder="Title"
           required>

    <textarea id="postDesc"
              placeholder="Description"
              required></textarea>

    <input type="file"
           id="postImageFile"
           accept="image/*"
           required>

    <button type="submit">
      Post Artwork
    </button>

  </form>

  <!-- POSTS -->

  <div class="posts-container"
       id="postsContainer">

  </div>

</main>

<!-- FIREBASE -->

<script type="module">

/* =========================
   FIREBASE IMPORTS
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

import {

  getFirestore,

  collection,

  addDoc,

  getDocs,

  query,

  orderBy,

  doc,

  updateDoc,

  increment

}
from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey: "AIzaSyDMBb5n4Tyf9XLSHU_7CZ1obDlHjzrw258",

  authDomain: "database-artmoots.firebaseapp.com",

  projectId: "database-artmoots",

  storageBucket: "database-artmoots.firebasestorage.app",

  messagingSenderId: "1056886155154",

  appId: "1:1056886155154:web:0de8b27263c11571ea034b"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

/* =========================
   GLOBALS
========================= */

const createPostForm =
  document.getElementById("createPost");

const postsContainer =
  document.getElementById("postsContainer");

const postImageFile =
  document.getElementById("postImageFile");

let imageUrl = "";

/* =========================
   IMAGE UPLOAD
========================= */

postImageFile.addEventListener("change", () => {

  const file = postImageFile.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = () => {

    imageUrl = reader.result;

  };

  reader.readAsDataURL(file);

});

/* =========================
   AUTH
========================= */

onAuthStateChanged(auth, user => {

  if(user){

    createPostForm.style.display = "block";

  }

  else{

    createPostForm.style.display = "none";

  }

});

/* =========================
   CREATE POST
========================= */

createPostForm.addEventListener("submit",
async e => {

  e.preventDefault();

  const title =
    document.getElementById("postTitle").value;

  const desc =
    document.getElementById("postDesc").value;

  const user = auth.currentUser;

  if(!user){

    alert("You must be signed in.");

    return;

  }

  if(!imageUrl){

    alert("Wait for image upload.");

    return;

  }

  await addDoc(collection(db,"posts"), {

    user:
      user.displayName || "Anonymous",

    title,

    description:desc,

    image:imageUrl,

    likes:0,

    views:0,

    createdAt:new Date()

  });

  createPostForm.reset();

  imageUrl = "";

  postsContainer.innerHTML = "";

  loadPosts();

});

/* =========================
   LIKE SYSTEM
========================= */

window.likePost = async function(postId){

  const postRef =
    doc(db,"posts",postId);

  await updateDoc(postRef,{

    likes:increment(1)

  });

  location.reload();

}

/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  const q = query(

    collection(db,"posts"),

    orderBy("createdAt","desc")

  );

  const snapshot =
    await getDocs(q);

  snapshot.forEach(async postDoc => {

    const data =
      postDoc.data();

    /* ADD VIEW */

    const postRef =
      doc(db,"posts",postDoc.id);

    await updateDoc(postRef,{

      views:increment(1)

    });

    /* CREATE CARD */

    const div =
      document.createElement("div");

    div.className = "post";

    div.innerHTML = `

      <img src="${data.image}">

      <div class="post-content">

        <h3>
          ${data.title}
        </h3>

        <p>
          ${data.description}
        </p>

        <div class="post-meta">

          <span>
            ❤️ ${data.likes || 0}
          </span>

          <span>
            👁 ${data.views || 0}
          </span>

        </div>

        <button onclick="likePost('${postDoc.id}')">

          Like

        </button>

      </div>

    `;

    postsContainer.appendChild(div);

  });

}

loadPosts();

</script>

</body>
</html>
