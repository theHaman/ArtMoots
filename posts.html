<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ArtMoots</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#ffffff;
  --text:#111;
  --purple:#b18eff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Inter",sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom: 3rem;
}

/* HEADER */
header{
  width:100%;
  padding:1rem 2rem;
  display:flex;
  justify-content:center;
}

.header-container{
  width:100%;
  display:flex;
  align-items:center;
  gap:1.5rem;
}

.logo{
  width:140px;
  height:42px;
  background:#d9d9d9;
}

.search-bar{
  flex:1;
  height:42px;
  border:1px solid #111;
  border-radius:999px;
  background:white;
  display:flex;
  align-items:center;
  padding:0 1rem;
}

.search-bar input{
  border:none;
  outline:none;
  width:100%;
  font-size: 1rem;
}

/* NAV */
nav{
  display:flex;
  align-items:center;
  gap:1.5rem;
  margin-left:auto;
}

nav a{
  text-decoration:none;
  color:#111;
  font-weight: 500;
}

/* ICON */
.icon-button{
  width:36px;
  height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.icon-button img{
  width:24px;
  height:24px;
}

/* DROPDOWN */
.account-wrapper{
  position:relative;
}

.account-menu{
  position:absolute;
  top:45px;
  right:0;
  width:220px;
  background:white;
  border-radius:14px;
  padding:0.6rem;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  display:none;
  flex-direction:column;
  z-index:999;
}

.account-menu.show{
  display:flex;
}

.account-user{
  padding:0.8rem 1rem;
  font-size:0.9rem;
  color:#666;
  border-bottom:1px solid #eee;
  margin-bottom:0.3rem;
}

.account-menu a,
.account-menu button{
  width:100%;
  border:none;
  background:none;
  text-align:left;
  padding:0.8rem 1rem;
  border-radius:10px;
  cursor:pointer;
  text-decoration:none;
  color:#111;
}

.account-menu a:hover,
.account-menu button:hover{
  background:#f3f3f3;
}

/* HERO */
.hero{
  height:420px;
  margin:0 1rem;
  border-radius: 0 0 24px 24px;
  background: radial-gradient(circle at top right, #e3f5ff, transparent 40%),
              radial-gradient(circle at top left, #e3f5ff, transparent 40%),
              #ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero-content h1{
  font-size: 3.5rem;
  font-weight: 500;
  margin-bottom: 1rem;
}

.hero-content p {
  font-size: 1rem;
  color: #333;
  margin-bottom: 2rem;
}

.hero-buttons {
  display: flex;
  gap: 1rem;
  justify-content: center;
}

.hero-btn{
  padding: 0.8rem 1.5rem;
  border-radius: 12px;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.9rem;
}

.hero-btn.black{
  background: black;
  color: white;
}

.hero-btn.purple{
  background: var(--purple);
  color: black;
}

/* CONTENT SECTIONS */
.section-container {
  padding: 2rem;
  max-width: 100%;
  margin: 0 auto;
}

.section-title {
  font-size: 1.2rem;
  font-weight: 600;
  margin-bottom: 1.5rem;
}

/* TOP ARTISTS GRID */
.artists-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 1rem;
  margin-bottom: 3rem;
}

.artist-card {
  border: 1px solid #ccc;
  border-radius: 16px;
  overflow: hidden;
  background: #fff;
  display: flex;
  flex-direction: column;
}

.artist-banner {
  height: 140px;
  background: #cccccc;
}

.artist-info {
  padding: 1rem;
  display: flex;
  align-items: center;
  gap: 0.8rem;
  border-top: 1px solid #ccc;
}

.artist-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #cccccc;
  flex-shrink: 0;
}

.artist-name-skeleton {
  height: 10px;
  background: #cccccc;
  width: 80%;
  border-radius: 4px;
}

/* MOST POPULAR GRID */
.popular-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 1rem;
}

.popular-card {
  height: 280px;
  background: #cccccc;
  border: 1px solid #ccc;
  border-radius: 16px;
}

/* Responsive Scaling down if viewport is smaller */
@media (max-width: 1024px) {
  .artists-grid, .popular-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}

</style>
</head>

<body>

<header>
  <div class="header-container">

    <div class="logo"></div>

    <div class="search-bar">
      <input type="text" placeholder="Search...">
    </div>

    <nav>
      <a href="posts.html">Gallery</a>
      <a href="#">About</a>

      <div class="account-wrapper">

        <div class="icon-button" id="accountButton">
          <img src="img/my-account-5.png" alt="👤">
        </div>

        <div class="account-menu" id="accountMenu">

          <div class="account-user" id="accountUser">
            Not Logged In
          </div>

          <a href="account.html?mode=login" id="loginBtn">Log In</a>
          <a href="account.html?mode=signup" id="signupBtn">Sign Up</a>

          <a href="account.html" id="viewAccountBtn" style="display:none;">
             View Account
          </a>

          <button id="logoutBtn" style="display:none;">
            Logout
          </button>

        </div>
      </div>

    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Welcome to ArtMoots</h1>
    <p>Share Art, Meet Moots and Grow Together!</p>
    <div class="hero-buttons">
      <a href="#" class="hero-btn black">Want to know more?</a>
      <a href="posts.html" class="hero-btn purple">Lets see some art!</a>
    </div>
  </div>
</section>

<main class="section-container">
  
  <h2 class="section-title">Top Artists</h2>
  <div class="artists-grid">
    <div class="artist-card">
      <div class="artist-banner"></div>
      <div class="artist-info">
        <div class="artist-avatar"></div>
        <div class="artist-name-skeleton"></div>
      </div>
    </div>
    <div class="artist-card">
      <div class="artist-banner"></div>
      <div class="artist-info">
        <div class="artist-avatar"></div>
        <div class="artist-name-skeleton"></div>
      </div>
    </div>
    <div class="artist-card">
      <div class="artist-banner"></div>
      <div class="artist-info">
        <div class="artist-avatar"></div>
        <div class="artist-name-skeleton"></div>
      </div>
    </div>
    <div class="artist-card">
      <div class="artist-banner"></div>
      <div class="artist-info">
        <div class="artist-avatar"></div>
        <div class="artist-name-skeleton"></div>
      </div>
    </div>
    <div class="artist-card">
      <div class="artist-banner"></div>
      <div class="artist-info">
        <div class="artist-avatar"></div>
        <div class="artist-name-skeleton"></div>
      </div>
    </div>
  </div>

  <h2 class="section-title">Most Popular</h2>
  <div class="popular-grid">
    <div class="popular-card"></div>
    <div class="popular-card"></div>
    <div class="popular-card"></div>
    <div class="popular-card"></div>
    <div class="popular-card"></div>
  </div>

</main>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

/* FIREBASE */
const app = initializeApp({
  apiKey: "AIzaSyDMBb5n4Tyf9XLSHU_7CZ1obDlHjzrw258",
  authDomain: "database-artmoots.firebaseapp.com",
  projectId: "database-artmoots"
});

const auth = getAuth(app);
const db = getFirestore(app);

/* DROPDOWN */
const accountButton = document.getElementById("accountButton");
const accountMenu = document.getElementById("accountMenu");

accountButton.addEventListener("click", (e) => {
  e.stopPropagation();
  accountMenu.classList.toggle("show");
});

document.addEventListener("click", (e) => {
  if (!accountMenu.contains(e.target) && !accountButton.contains(e.target)) {
    accountMenu.classList.remove("show");
  }
});

/* ELEMENTS */
const accountUser = document.getElementById("accountUser");
const loginBtn = document.getElementById("loginBtn");
const signupBtn = document.getElementById("signupBtn");
const logoutBtn = document.getElementById("logoutBtn");
const viewAccountBtn = document.getElementById("viewAccountBtn");

/* =========================
   REAL AUTH SYSTEM
========================= */
onAuthStateChanged(auth, async (user) => {

  if (user) {

    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);

  if (snap.exists()) {
      accountUser.textContent = snap.data().name || "User";
    } else {
      accountUser.textContent = user.email;
    }

    // SHOW LOGGED IN UI
    loginBtn.style.display = "none";
    signupBtn.style.display = "none";
    logoutBtn.style.display = "block";
    viewAccountBtn.style.display = "block";

  } else {

    accountUser.textContent = "Not Logged In";

    loginBtn.style.display = "block";
    signupBtn.style.display = "block";
    logoutBtn.style.display = "none";
    viewAccountBtn.style.display = "none";
  }
});

/* LOGOUT */
logoutBtn.addEventListener("click", async () => {
  await signOut(auth);
  location.reload();
});

</script>

</body>
</html>
