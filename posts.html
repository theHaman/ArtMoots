<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ArtMoots - Posts</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================
   ROOT & GENERAL RESETS
========================= */
:root{
  --bg:#f7f7f7;
  --text:#111;
  --muted:#666;
  --purple:#b18eff;
}

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Inter",sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* =========================
   HEADER (Matched to Home)
========================= */
header{
  width:100%;
  padding:1rem 2rem;
  display:flex;
  justify-content:center;
  background: white; /* Clean background for the nav bar */
  border-bottom: 1px solid #f0f0f0;
}

.header-container{
  width:100%;
  display:flex;
  align-items:center;
  gap:1.5rem;
}

.logo{
  width:140px;
  height:42px;
  background:#d9d9d9;
  flex-shrink:0;
}

/* =========================
   SEARCH BAR (Matched to Home)
========================= */
.search-bar{
  flex:1;
  height:42px;
  border:1px solid #111;
  border-radius:999px;
  background:white;
  display:flex;
  align-items:center;
  padding:0 1rem;
}

.search-bar input{
  border:none;
  outline:none;
  width:100%;
  font-size: 1rem;
  background: transparent;
}

/* =========================
   NAVIGATION (Matched to Home)
========================= */
nav{
  display:flex;
  align-items:center;
  gap:1.5rem;
  margin-left:auto;
}

nav a{
  text-decoration:none;
  color:#111;
  font-weight: 500;
  font-size: 1rem;
}

/* ICON BUTTON (Matched to Home) */
.icon-button{
  width:36px;
  height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.icon-button img{
  width:24px;
  height:24px;
}

/* DROPDOWN MENU (Matched to Home) */
.account-wrapper{
  position:relative;
}

.account-menu{
  position:absolute;
  top:45px;
  right:0;
  width:220px;
  background:white;
  border-radius:14px;
  padding:0.6rem;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  display:none;
  flex-direction:column;
  z-index:999;
}

.account-menu.show{
  display:flex;
}

.account-user{
  padding:0.8rem 1rem;
  font-size:0.9rem;
  color:#666;
  border-bottom:1px solid #eee;
  margin-bottom:0.3rem;
  text-align: left;
}

.account-menu a,
.account-menu button{
  width:100%;
  border:none;
  background:none;
  text-align:left;
  padding:0.8rem 1rem;
  border-radius:10px;
  cursor:pointer;
  text-decoration:none;
  color:#111;
  font-family: inherit;
  font-size: 0.95rem;
}

.account-menu a:hover,
.account-menu button:hover{
  background:#f3f3f3;
}

/* =========================
   HERO
========================= */
.hero{
  margin:0 1rem;
  height:280px;
  border-radius:0 0 20px 20px;
  background: linear-gradient(90deg, #dff5ff 0%, #f6f6f6 30%, #f6f6f6 70%, #dff5ff 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero-content h1{
  font-size:4rem;
  line-height:0.95;
  font-weight:500;
  margin-bottom:1rem;
}

.hero-content p{
  color:#444;
  font-size:1rem;
}

/* =========================
   MAIN
========================= */
main{
  padding:2rem 1rem 5rem;
}

/* =========================
   CREATE POST
========================= */
#createPost{
  background:white;
  padding:1.5rem;
  border-radius:22px;
  margin-bottom:2rem;
  box-shadow: 0 10px 20px rgba(0,0,0,0.05);
  display: none; 
}

#createPost h2{
  margin-bottom:1rem;
}

#createPost input,
#createPost textarea{
  width:100%;
  border:none;
  background:#f2f2f2;
  padding:1rem;
  border-radius:14px;
  margin-bottom:1rem;
  font-family:inherit;
  outline: none;
}

#createPost textarea{
  min-height:120px;
  resize:vertical;
}

#createPost button{
  border:none;
  background:black;
  color:white;
  padding:1rem 1.3rem;
  border-radius:14px;
  cursor:pointer;
  font-weight:600;
}

/* =========================
   POSTS MASONRY GRID
========================= */
.posts-container{
  columns:3 320px;
  column-gap:1rem;
}

.post{
  break-inside:avoid;
  background:white;
  border-radius:22px;
  overflow:hidden;
  margin-bottom:1rem;
  box-shadow: 0 10px 25px rgba(0,0,0,0.06);
  transition:0.25s;
}

.post:hover{
  transform:translateY(-4px);
}

.post img{
  width:100%;
  display:block;
}

.post-content{
  padding:1rem;
}

.post-content h3{
  margin-bottom:0.7rem;
}

.post-content p{
  color:#666;
  line-height:1.7;
  margin-bottom:1rem;
}

.post-meta{
  display:flex;
  gap:1rem;
  margin-bottom:1rem;
  color:#555;
}

.post button{
  border:none;
  background:#111;
  color:white;
  padding:0.8rem 1rem;
  border-radius:12px;
  cursor:pointer;
}

/* =========================
   RESPONSIVE DESIGN BOUNDS
========================= */
@media(max-width:700px){
  nav{
    display:none;
  }
  .hero-content h1{
    font-size:2.7rem;
  }
}
</style>
</head>
<body>

<header>
  <div class="header-container">
    <div class="logo"></div>
    
    <div class="search-bar">
      <input type="text" placeholder="Search...">
    </div>

    <nav>
      <a href="posts.html">Gallery</a>
      <a href="#">About</a>

      <div class="account-wrapper">
        <div class="icon-button" id="accountButton">
          <img src="img/my-account-5.png" alt="👤">
        </div>

        <div class="account-menu" id="accountMenu">
          <div class="account-user" id="accountUser">Not Logged In</div>
          <a href="account.html?mode=login" id="loginBtn">Log In</a>
          <a href="account.html?mode=signup" id="signupBtn">Sign Up</a>
          <a href="account.html" id="viewAccountBtn" style="display:none;">View Account</a>
          <button id="logoutBtn" style="display:none;">Logout</button>
        </div>
      </div>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Explore Art</h1>
    <p>Discover artwork from the ArtMoots community.</p>
  </div>
</section>

<main>
  <form id="createPost">
    <h2>Create a Post</h2>
    <input type="text" id="postTitle" placeholder="Title" required>
    <textarea id="postDesc" placeholder="Description" required></textarea>
    <input type="file" id="postImageFile" accept="image/*" required>
    <button type="submit">Post Artwork</button>
  </form>

  <div class="posts-container" id="postsContainer"></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMBb5n4Tyf9XLSHU_7CZ1obDlHjzrw258",
  authDomain: "database-artmoots.firebaseapp.com",
  projectId: "database-artmoots",
  storageBucket: "database-artmoots.firebasestorage.app",
  messagingSenderId: "1056886155154",
  appId: "1:1056886155154:web:0de8b27263c11571ea034b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* DOM ELEMENTS */
const createPostForm = document.getElementById("createPost");
const postsContainer = document.getElementById("postsContainer");
const postImageFile = document.getElementById("postImageFile");

const accountButton = document.getElementById("accountButton");
const accountMenu = document.getElementById("accountMenu");
const accountUser = document.getElementById("accountUser");
const loginBtn = document.getElementById("loginBtn");
const signupBtn = document.getElementById("signupBtn");
const viewAccountBtn = document.getElementById("viewAccountBtn");
const logoutBtn = document.getElementById("logoutBtn");

let imageUrl = "";

/* ====================================
   DROPDOWN CONTROLLER (Matched to Home)
==================================== */
accountButton.addEventListener("click", (e) => {
  e.stopPropagation();
  accountMenu.classList.toggle("show");
});

document.addEventListener("click", (e) => {
  if (!accountMenu.contains(e.target) && !accountButton.contains(e.target)) {
    accountMenu.classList.remove("show");
  }
});

/* =========================================================
   CANVAS SYSTEM: OPTIMIZE ARTWORK TO PREVENT SIZE CRASHES
========================================================= */
function resizeAndCompressArtwork(file, maxDimension, quality) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = function (event) {
      const img = new Image();
      img.src = event.target.result;
      img.onload = function () {
        const canvas = document.createElement("canvas");
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxDimension) {
            height = Math.round((height * maxDimension) / width);
            width = maxDimension;
          }
        } else {
          if (height > maxDimension) {
            width = Math.round((width * maxDimension) / height);
            height = maxDimension;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        const compressedBase64 = canvas.toDataURL("image/jpeg", quality);
        resolve(compressedBase64);
      };
    };
  });
}

postImageFile.addEventListener("change", async () => {
  const file = postImageFile.files[0];
  if(!file) return;
  imageUrl = await resizeAndCompressArtwork(file, 1200, 0.8);
});

/* AUTH SESSION GATEKEEPER (Matched to Home) */
onAuthStateChanged(auth, async (user) => {
  if(user){
    createPostForm.style.display = "block";
    loginBtn.style.display = "none";
    signupBtn.style.display = "none";
    logoutBtn.style.display = "block";
    viewAccountBtn.style.display = "block";

    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);
    if(snap.exists()){
      accountUser.textContent = snap.data().name || "User";
    } else {
      accountUser.textContent = user.email;
    }
  } else {
    createPostForm.style.display = "none";
    loginBtn.style.display = "block";
    signupBtn.style.display = "block";
    logoutBtn.style.display = "none";
    viewAccountBtn.style.display = "none";
    accountUser.textContent = "Not Logged In";
  }
});

/* LOGOUT CALLER */
logoutBtn.addEventListener("click", async () => {
  await signOut(auth);
  location.reload();
});

/* =========================
   CREATE NEW ENTRY SUBMIT ROUTE
========================= */
createPostForm.addEventListener("submit", async e => {
  e.preventDefault();

  const title = document.getElementById("postTitle").value;
  const desc = document.getElementById("postDesc").value;
  const user = auth.currentUser;

  if(!user){
    alert("You must be signed in.");
    return;
  }

  if(!imageUrl){
    alert("Please upload or wait for your image to process.");
    return;
  }

  try {
    const userSnap = await getDoc(doc(db, "users", user.uid));
    const activePosterName = userSnap.exists() ? (userSnap.data().name || "Anonymous Artist") : (user.displayName || "Anonymous Artist");

    await addDoc(collection(db, "posts"), {
      user: activePosterName,
      title,
      description: desc,
      image: imageUrl,
      likes: 0,
      views: 0, 
      createdAt: new Date()
    });

    createPostForm.reset();
    imageUrl = "";
    postsContainer.innerHTML = "";
    
    loadPosts();
  } catch(err) {
    alert("Error uploading post: " + err.message);
  }
});

/* =========================
   LIKE ACTION ROUTER
========================= */
window.likePost = async function(postId){
  try {
    const postRef = doc(db, "posts", postId);
    await updateDoc(postRef, {
      likes: increment(1)
    });
    location.reload();
  } catch (err) {
    console.error("Could not complete tracking transaction: ", err);
  }
};

/* =========================
   LOAD ASSET STREAMS
========================= */
async function loadPosts(){
  try {
    const q = query(
      collection(db, "posts"),
      orderBy("createdAt", "desc")
    );

    const snapshot = await getDocs(q);
    postsContainer.innerHTML = ""; 

    snapshot.forEach(postDoc => {
      const data = postDoc.data();

      const div = document.createElement("div");
      div.className = "post";
      div.innerHTML = `
        <img src="${data.image}">
        <div class="post-content">
          <h3>${data.title}</h3>
          <p>${data.description}</p>
          <div class="post-meta">
            <span>❤️ ${data.likes || 0}</span>
            <span>👁 ${data.views || 0}</span>
          </div>
          <button onclick="likePost('${postDoc.id}')">Like</button>
        </div>
      `;

      postsContainer.appendChild(div);
    });
  } catch (error) {
    console.error("Error rendering post feeds: ", error);
  }
}

loadPosts();
</script>

</body>
</html>
