<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>ArtMoots - Account</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#f7f7f7;
  --text:#111;
  --purple:#caa6ff;
}

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Inter",sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* =========================
   HEADER (MATCH HOME PAGE)
========================= */

header{
  width:100%;
  padding:1rem;
  display:flex;
  justify-content:center;
  background:transparent;
}

.header-container{
  width:100%;
  display:flex;
  align-items:center;
  gap:1rem;
}

.logo{
  width:140px;
  height:42px;
  background:#d9d9d9;
  border-radius:2px;
}

/* NAV */
nav{
  display:flex;
  align-items:center;
  gap:1.5rem;
  margin-left:auto;
}

nav a{
  text-decoration:none;
  color:#111;
  font-size:0.95rem;
  font-weight:500;
}

/* ICONS (MATCH HOME) */
.icon-button{
  width:36px;
  height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
}

.icon-button:hover{
  background:#ececec;
}

.icon-button img{
  width:20px;
  height:20px;
  object-fit:contain;
}

/* ACCOUNT DROPDOWN */
.account-wrapper{
  position:relative;
}

.account-menu{
  position:absolute;
  top:50px;
  right:0;

  width:220px;
  background:white;
  border-radius:14px;
  padding:0.6rem;

  box-shadow:0 10px 30px rgba(0,0,0,0.08);

  display:none;
  flex-direction:column;

  z-index:999;
}

.account-menu.show{
  display:flex;
}

.account-user{
  padding:0.8rem 1rem;
  font-size:0.9rem;
  color:#666;
  border-bottom:1px solid #eee;
  margin-bottom:0.3rem;
}

.account-menu a,
.account-menu button{
  width:100%;
  border:none;
  background:none;
  text-align:left;
  padding:0.8rem 1rem;
  border-radius:10px;
  text-decoration:none;
  color:#111;
  font-size:0.95rem;
  cursor:pointer;
  font-family:inherit;
}

.account-menu a:hover,
.account-menu button:hover{
  background:#f3f3f3;
}

/* =========================
   PROFILE
========================= */

.profile{
  max-width:1100px;
  margin:auto;
  padding-bottom:4rem;
}

.banner{
  height:300px;
  background:#d7d7d7;
  border-radius:0 0 30px 30px;
  overflow:hidden;
}

.banner img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-info{
  padding:2rem;
}

.pfp{
  width:140px;
  height:140px;
  border-radius:50%;
  border:6px solid white;
  overflow:hidden;
  background:#ccc;
  margin-top:-90px;
}

.pfp img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-info h1{
  margin-top:1rem;
  font-size:2rem;
}

.bio{
  color:#666;
  margin-top:1rem;
  max-width:600px;
  line-height:1.7;
}

.stats{
  display:flex;
  gap:2rem;
  margin-top:1.5rem;
}

.stat-number{
  font-weight:700;
  font-size:1.2rem;
}

/* BUTTONS */
.edit-btn{
  margin-top:2rem;
  border:none;
  background:black;
  color:white;
  padding:1rem 1.3rem;
  border-radius:14px;
  cursor:pointer;
}

.save-btn{
  border:none;
  background:black;
  color:white;
  padding:1rem 1.2rem;
  border-radius:14px;
  cursor:pointer;
}

/* EDIT SECTION */
.edit-section{
  margin-top:2rem;
  background:white;
  padding:1.5rem;
  border-radius:24px;
}

.edit-section input,
.edit-section textarea{
  width:100%;
  border:none;
  background:#f2f2f2;
  padding:1rem;
  border-radius:14px;
  margin-bottom:1rem;
  font-family:inherit;
}

/* POSTS */
.user-posts{
  margin-top:3rem;
}

.posts-grid{
  columns:3 320px;
  column-gap:1rem;
}

.post{
  break-inside:avoid;
  background:white;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:1rem;
}

.post img{
  width:100%;
  display:block;
}

.post-content{
  padding:1rem;
}

.loading, .no-posts{
  text-align:center;
  padding:2rem;
  color:#666;
  background:white;
  border-radius:20px;
}

</style>
</head>

<body>

<!-- HEADER (MATCH HOME) -->
<header>
  <div class="header-container">

    <div class="logo"></div>

    <nav>
      <a href="index.html">Home</a>
      <a href="posts.html">Gallery</a>

      <!-- ACCOUNT -->
      <div class="account-wrapper">

        <div class="icon-button" id="accountButton">
          <img src="img/my-account-5.png">
        </div>

        <div class="account-menu" id="accountMenu">

          <div class="account-user" id="accountUser">
            Not Logged In
          </div>

          <a href="account.html?mode=login" id="loginBtn">Log In</a>
          <a href="account.html?mode=signup" id="signupBtn">Sign Up</a>

          <button id="logoutBtn" style="display:none;">Logout</button>

        </div>
      </div>

    </nav>
  </div>
</header>

<!-- PROFILE -->
<div class="profile">

  <div class="banner">
    <img id="bannerPreview" src="https://placehold.co/1200x300">
  </div>

  <div class="profile-info">

    <div class="pfp">
      <img id="pfpPreview" src="https://placehold.co/200">
    </div>

    <h1 id="profileName">Loading...</h1>
    <p class="bio" id="profileBio"></p>

    <div class="stats">
      <div>
        <div class="stat-number" id="followersCount">0</div>
        Followers
      </div>
      <div>
        <div class="stat-number" id="followingCount">0</div>
        Following
      </div>
    </div>

    <button class="edit-btn" id="toggleEdit">Edit Profile</button>

    <div class="edit-section" id="editSection" style="display:none;">
      <input id="usernameInput">
      <textarea id="bioInput"></textarea>

      <button class="save-btn" id="saveProfile">Save Profile</button>
    </div>

  </div>
</div>

<script>
/* DROPDOWN */
const accountButton = document.getElementById("accountButton");
const accountMenu = document.getElementById("accountMenu");

accountButton.addEventListener("click",(e)=>{
  e.stopPropagation();
  accountMenu.classList.toggle("show");
});

document.addEventListener("click",()=>{
  accountMenu.classList.remove("show");
});

/* LOGIN STATE */
const currentUser = localStorage.getItem("currentUser");

const accountUser = document.getElementById("accountUser");
const loginBtn = document.getElementById("loginBtn");
const signupBtn = document.getElementById("signupBtn");
const logoutBtn = document.getElementById("logoutBtn");

if(currentUser){
  accountUser.textContent = currentUser;
  loginBtn.style.display="none";
  signupBtn.style.display="none";
  logoutBtn.style.display="block";
}

logoutBtn.onclick = ()=>{
  localStorage.removeItem("currentUser");
  location.reload();
};
</script>

</body>
</html>
