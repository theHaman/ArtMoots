<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ArtMoots - Account</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#f7f7f7;
  --text:#111;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:"Inter",sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER (MATCH HOME) */
header{
  width:100%;
  padding:1rem;
  display:flex;
  justify-content:center;
}

.header-container{
  width:100%;
  display:flex;
  align-items:center;
  gap:1rem;
}

.logo{
  width:140px;
  height:42px;
  background:#d9d9d9;
  border-radius:2px;
}

/* NAV */
nav{
  display:flex;
  align-items:center;
  gap:1.5rem;
  margin-left:auto;
}

nav a{
  text-decoration:none;
  color:#111;
  font-weight:500;
}

/* ICONS */
.icon-button{
  width:36px;
  height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.icon-button img{
  width:20px;
  height:20px;
}

/* DROPDOWN */
.account-wrapper{position:relative;}

.account-menu{
  position:absolute;
  top:50px;
  right:0;
  width:220px;
  background:white;
  border-radius:14px;
  padding:0.6rem;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  display:none;
  flex-direction:column;
  z-index:999;
}

.account-menu.show{display:flex;}

.account-user{
  padding:0.8rem 1rem;
  color:#666;
  border-bottom:1px solid #eee;
  margin-bottom:0.3rem;
}

.account-menu a,
.account-menu button{
  width:100%;
  border:none;
  background:none;
  text-align:left;
  padding:0.8rem 1rem;
  border-radius:10px;
  cursor:pointer;
}

.account-menu a:hover,
.account-menu button:hover{
  background:#f3f3f3;
}

/* PROFILE */
.profile{
  max-width:1100px;
  margin:auto;
}

.banner{
  height:300px;
  border-radius:0 0 30px 30px;
  overflow:hidden;
  background:#ddd;
}

.banner img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.pfp{
  width:140px;
  height:140px;
  border-radius:50%;
  border:6px solid white;
  margin-top:-90px;
  overflow:hidden;
  background:#ccc;
}

.pfp img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-info{
  padding:2rem;
}

.profile-info h1{
  font-size:2rem;
  margin-top:1rem;
}

.bio{
  margin-top:1rem;
  color:#666;
  max-width:600px;
}

.stats{
  display:flex;
  gap:2rem;
  margin-top:1.5rem;
}

.stat-number{
  font-weight:700;
}

.edit-btn{
  margin-top:2rem;
  padding:1rem;
  border:none;
  background:black;
  color:white;
  border-radius:14px;
  cursor:pointer;
}

.edit-section{
  display:none;
  margin-top:2rem;
  background:white;
  padding:1.5rem;
  border-radius:20px;
}

.edit-section input,
.edit-section textarea{
  width:100%;
  padding:1rem;
  margin-bottom:1rem;
  border:none;
  background:#f2f2f2;
  border-radius:12px;
}

</style>
</head>

<body>

<header>
  <div class="header-container">

    <div class="logo"></div>

    <nav>
      <a href="index.html">Home</a>
      <a href="posts.html">Gallery</a>

      <div class="account-wrapper">

        <div class="icon-button" id="accountButton">
          <img src="img/my-account-5.png">
        </div>

        <div class="account-menu" id="accountMenu">

          <div class="account-user" id="accountUser">Loading...</div>

          <a href="account.html?mode=login" id="loginBtn">Log In</a>
          <a href="account.html?mode=signup" id="signupBtn">Sign Up</a>
          <button id="logoutBtn" style="display:none;">Logout</button>

        </div>

      </div>

    </nav>
  </div>
</header>

<div class="profile">

  <div class="banner">
    <img id="bannerPreview">
  </div>

  <div class="profile-info">

    <div class="pfp">
      <img id="pfpPreview">
    </div>

    <h1 id="profileName">Loading...</h1>
    <p class="bio" id="profileBio"></p>

    <div class="stats">
      <div>
        <div class="stat-number" id="followersCount">0</div>
        Followers
      </div>
      <div>
        <div class="stat-number" id="followingCount">0</div>
        Following
      </div>
    </div>

    <button class="edit-btn" id="toggleEdit">Edit Profile</button>

    <div class="edit-section" id="editSection">
      <input id="usernameInput">
      <textarea id="bioInput"></textarea>
      <button id="saveProfile">Save</button>
    </div>

  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDMBb5n4Tyf9XLSHU_7CZ1obDlHjzrw258",
  authDomain: "database-artmoots.firebaseapp.com",
  projectId: "database-artmoots"
});

const auth = getAuth(app);
const db = getFirestore(app);

/* UI */
const profileName = document.getElementById("profileName");
const profileBio = document.getElementById("profileBio");
const pfp = document.getElementById("pfpPreview");
const banner = document.getElementById("bannerPreview");

const accountUser = document.getElementById("accountUser");
const loginBtn = document.getElementById("loginBtn");
const signupBtn = document.getElementById("signupBtn");
const logoutBtn = document.getElementById("logoutBtn");

/* DROPDOWN */
document.getElementById("accountButton").onclick = (e)=>{
  e.stopPropagation();
  document.getElementById("accountMenu").classList.toggle("show");
};

document.addEventListener("click", ()=>{
  document.getElementById("accountMenu").classList.remove("show");
});

/* AUTH LOAD (THIS FIXES EVERYTHING) */
onAuthStateChanged(auth, async (user)=>{

  if(!user){
    profileName.textContent = "Not logged in";
    return;
  }

  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);

  if(snap.exists()){
    const data = snap.data();

    profileName.textContent = data.username;
    profileBio.textContent = data.bio;

    pfp.src = data.pfp;
    banner.src = data.banner;

    accountUser.textContent = data.username;

  } else {
    profileName.textContent = "No profile found";
  }

  loginBtn.style.display="none";
  signupBtn.style.display="none";
  logoutBtn.style.display="block";

});

/* LOGOUT */
logoutBtn.onclick = async ()=>{
  const { signOut } = await import("https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js");
  await signOut(auth);
  location.reload();
};

</script>

</body>
</html>
