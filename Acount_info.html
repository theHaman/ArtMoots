<!-- =========================================================
ACCOUNT.HTML
========================================================= -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ArtMoots - Account</title>

<link rel="preconnect"
      href="https://googleapis.com">

<link rel="preconnect"
      href="https://gstatic.com"
      crossorigin>

<link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<style>

:root{

  --bg:#f7f7f7;
  --text:#111;
  --muted:#666;

}

*{

  margin:0;
  padding:0;
  box-sizing:border-box;

}

body{

  font-family:"Inter",sans-serif;

  background:var(--bg);

  color:var(--text);

}

/* HEADER */

header{

  padding:1rem;

  background:white;

}

.header-container{

  display:flex;

  align-items:center;

  justify-content:space-between;

}

nav{

  display:flex;

  gap:1rem;

}

nav a{

  text-decoration:none;

  color:#111;

}

/* PROFILE */

.profile{

  max-width:1100px;

  margin:auto;

  padding-bottom:4rem;

}

.banner{

  height:300px;

  background:#d7d7d7;

  border-radius:0 0 30px 30px;

  overflow:hidden;

  position:relative;

}

.banner img{

  width:100%;
  height:100%;

  object-fit:cover;

}

.profile-info{

  padding:2rem;

  position:relative;

}

.pfp{

  width:140px;
  height:140px;

  border-radius:50%;

  border:6px solid white;

  overflow:hidden;

  background:#ccc;

  margin-top:-90px;

}

.pfp img{

  width:100%;
  height:100%;

  object-fit:cover;

}

.profile-info h1{

  margin-top:1rem;

  font-size:2rem;

}

.bio{

  color:#666;

  margin-top:1rem;

  max-width:600px;

  line-height:1.7;

}

.stats{

  display:flex;

  gap:2rem;

  margin-top:1.5rem;

}

.stat-number{

  font-weight:700;

  font-size:1.2rem;

}

.edit-btn{

  margin-top:2rem;

  border:none;

  background:black;

  color:white;

  padding:1rem 1.3rem;

  border-radius:14px;

  cursor:pointer;

}

.edit-section{

  margin-top:2rem;

  background:white;

  padding:1.5rem;

  border-radius:24px;

}

.edit-section input,
.edit-section textarea{

  width:100%;

  border:none;

  background:#f2f2f2;

  padding:1rem;

  border-radius:14px;

  margin-bottom:1rem;

  font-family:inherit;

}

.edit-section textarea{

  min-height:120px;

  resize:vertical;

}

.save-btn{

  border:none;

  background:black;

  color:white;

  padding:1rem 1.2rem;

  border-radius:14px;

  cursor:pointer;

}

.user-posts{

  margin-top:3rem;

}

.posts-grid{

  columns:3 320px;

  column-gap:1rem;

}

.post{

  break-inside:avoid;

  background:white;

  border-radius:20px;

  overflow:hidden;

  margin-bottom:1rem;

}

.post img{

  width:100%;

  display:block;

}

.post-content{

  padding:1rem;

}

</style>
</head>
<body>

<header>

  <div class="header-container">

    <h2>
      ArtMoots
    </h2>

    <nav>

      <a href="account.html">
        Home
      </a>

      <a href="posts.html">
        Gallery
      </a>

    </nav>

  </div>

</header>

<div class="profile">

  <!-- BANNER -->

  <div class="banner">

    <img id="bannerPreview"
         src="https://placehold.co">

  </div>

  <!-- PROFILE INFO -->

  <div class="profile-info">

    <div class="pfp">

      <img id="pfpPreview"
           src="https://placehold.co">

    </div>

    <h1 id="profileName">
      Artist
    </h1>

    <p class="bio"
       id="profileBio">

      No bio yet.

    </p>

    <div class="stats">

      <div>

        <div class="stat-number"
             id="followersCount">
          0
        </div>

        Followers

      </div>

      <div>

        <div class="stat-number"
             id="followingCount">
          0
        </div>

        Following

      </div>

    </div>

    <button class="edit-btn"
            id="toggleEdit">

      Edit Profile

    </button>

    <!-- EDIT PROFILE -->

    <div class="edit-section"
         id="editSection"
         style="display:none;">

      <input type="text"
             id="usernameInput"
             placeholder="Username">

      <textarea id="bioInput"
                placeholder="Bio"></textarea>

      <label>
        Profile Picture
      </label>

      <input type="file"
             id="pfpInput"
             accept="image/*">

      <label>
        Banner Image
      </label>

      <input type="file"
             id="bannerInput"
             accept="image/*">

      <button class="save-btn"
              id="saveProfile">

        Save Profile

      </button>

    </div>

    <!-- USER POSTS -->

    <div class="user-posts">

      <h2>
        My Artwork
      </h2>

      <div class="posts-grid"
           id="userPosts">

      </div>

    </div>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://gstatic.com";

import {
  getAuth,
  onAuthStateChanged
}
from "https://gstatic.com";

import {

  getFirestore,

  doc,

  setDoc,

  getDoc,

  collection,

  query,

  where,

  getDocs

}
from "https://gstatic.com";

/* FIREBASE */

const firebaseConfig = {

  apiKey: "AIzaSyDMBb5n4Tyf9XLSHU_7CZ1obDlHjzrw258",

  authDomain: "://firebaseapp.com",

  projectId: "database-artmoots",

  storageBucket: "database-artmoots.firebasestorage.app",

  messagingSenderId: "1056886155154",

  appId: "1:1056886155154:web:0de8b27263c11571ea034b"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

/* ELEMENTS */

const profileName =
  document.getElementById("profileName");

const profileBio =
  document.getElementById("profileBio");

const pfpPreview =
  document.getElementById("pfpPreview");

const bannerPreview =
  document.getElementById("bannerPreview");

const followersCount =
  document.getElementById("followersCount");

const followingCount =
  document.getElementById("followingCount");

const editSection =
  document.getElementById("editSection");

const toggleEdit =
  document.getElementById("toggleEdit");

const saveProfile =
  document.getElementById("saveProfile");

const usernameInput =
  document.getElementById("usernameInput");

const bioInput =
  document.getElementById("bioInput");

const pfpInput =
  document.getElementById("pfpInput");

const bannerInput =
  document.getElementById("bannerInput");

const userPosts =
  document.getElementById("userPosts");

/* TOGGLE EDIT */

toggleEdit.onclick = () => {

  editSection.style.display =
    editSection.style.display === "none"
    ? "block"
    : "none";

};

/* IMAGE CONVERSION */

function fileToBase64(file){

  return new Promise(resolve => {

    const reader = new FileReader();

    reader.onload = () => {

      resolve(reader.result);

    };

    reader.readAsDataURL(file);

  });

}

/* USER POST GALLERY LOADER */
async function loadUserPosts(uid) {
  if (!userPosts) return;
  userPosts.innerHTML = "";
  try {
    const q = query(collection(db, "posts"), where("userId", "==", uid));
    const querySnapshot = await getDocs(q);
    querySnapshot.forEach((doc) => {
      const data = doc.data();
      const postEl = document.createElement("div");
      postEl.className = "post";
      postEl.innerHTML = `<img src="${data.imageUrl || 'https://placehold.co'}" alt="Artwork">`;
      userPosts.appendChild(postEl);
    });
  } catch (error) {
    console.error("Error loading user artwork elements:", error);
  }
}

/* LOAD USER */

onAuthStateChanged(auth,
async user => {

  if(!user){

    location.href = "account.html"; // Redirects to your login page file name

    return;

  }

  const userRef =
    doc(db,"users",user.uid);

  const userSnap =
    await getDoc(userRef);

  if(userSnap.exists()){

    const data =
      userSnap.data();

    profileName.textContent =
      data.username || "Artist";

    profileBio.textContent =
      data.bio || "No bio yet.";

    pfpPreview.src =
      data.pfp || "https://placehold.co";

    bannerPreview.src =
      data.banner || "https://placehold.co";

    followersCount.textContent =
      data.followers || 0;

    followingCount.textContent =
      data.following || 0;

    usernameInput.value =
      data.username || "";

    bioInput.value =
      data.bio || "";

  }

  loadUserPosts(user.uid);

});

/* SAVE PROFILE */

saveProfile.onclick = async () => {

  const user =
    auth.currentUser;

  if(!user) return;

  let pfp =
    pfpPreview.src;

  let banner =
    bannerPreview.src;

  // FIXED: Targets the actual single file wrapper object [0] inside the array list 
  if(pfpInput.files && pfpInput.files[0]){

    pfp =
      await fileToBase64(
        pfpInput.files[0]
      );

  }

  // FIXED: Targets the actual single file wrapper object [0] inside the array list 
  if(bannerInput.files && bannerInput.files[0]){

    banner =
      await fileToBase64(
        bannerInput.files[0]
      );

  }

  try {
    await setDoc(doc(db, "users", user.uid), {
      username: usernameInput.value,
      bio: bioInput.value,
      pfp: pfp,
      banner: banner
    }, { merge: true });

    alert("Profile saved successfully!");
    location.reload();
  } catch (error) {
    console.error("Error saving document changes:", error);
  }
};
</script>
</body>
</html>
