<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ArtMoots</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#f7f7f7;
  --text:#111;
  --muted:#666;
  --purple:#caa6ff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Inter",sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* HEADER */
header{
  width:100%;
  padding:1rem;
  display:flex;
  justify-content:center;
}

.header-container{
  width:100%;
  display:flex;
  align-items:center;
  gap:1rem;
}

.logo{
  width:140px;
  height:42px;
  background:#d9d9d9;
  border-radius:2px;
}

/* SEARCH */
.search-bar{
  flex:1;
  height:42px;
  border:1px solid #444;
  border-radius:999px;
  background:white;
  display:flex;
  align-items:center;
  padding:0 1rem;
  gap:0.8rem;
}

.search-bar input{
  border:none;
  outline:none;
  width:100%;
  background:transparent;
  font-size:1rem;
}

/* NAV */
nav{
  display:flex;
  align-items:center;
  gap:1.5rem;
  margin-left:auto;
}

nav a{
  text-decoration:none;
  color:#111;
  font-size:0.95rem;
  font-weight:500;
}

/* ICON BUTTON */
.icon-button img{
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
}

.icon-button:hover{
  background:#ececec;
}

/* =========================
   DROPDOWN FIX (IMPORTANT)
========================= */

.account-wrapper{
  position:relative;
}

.account-menu{
  position:absolute;
  top:55px;
  right:0;

  width:220px;
  background:white;
  border-radius:18px;
  padding:0.6rem;

  box-shadow:0 10px 30px rgba(0,0,0,0.08);

  display:none;
  flex-direction:column;

  z-index:999;
}

.account-menu.show{
  display:flex;
}

.account-user{
  padding:0.9rem 1rem;
  font-size:0.9rem;
  color:#666;
  border-bottom:1px solid #eee;
  margin-bottom:0.3rem;
}

.account-menu a,
.account-menu button{
  width:100%;
  border:none;
  background:none;
  text-align:left;
  padding:0.9rem 1rem;
  border-radius:12px;
  text-decoration:none;
  color:#111;
  font-size:0.95rem;
  cursor:pointer;
  font-family:inherit;
}

.account-menu a:hover,
.account-menu button:hover{
  background:#f3f3f3;
}

/* HERO */
.hero{
  margin:0 1rem;
  height:380px;
  border-radius:0 0 18px 18px;

  background:linear-gradient(90deg,#dff5ff 0%,#f6f6f6 30%,#f6f6f6 70%,#dff5ff 100%);

  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero-content h1{
  font-size:5rem;
  font-weight:500;
}

.hero-buttons{
  display:flex;
  gap:1rem;
  justify-content:center;
}

.hero-btn{
  padding:1rem 1.4rem;
  border-radius:14px;
  text-decoration:none;
  font-weight:600;
}

.hero-btn.black{
  background:black;
  color:white;
}

.hero-btn.purple{
  background:var(--purple);
  color:black;
}

/* MAIN */
main{
  padding:2rem 1rem 5rem;
}

.section{
  margin-top:2rem;
}

.section-title{
  font-size:1.4rem;
  font-weight:700;
  margin-bottom:1.5rem;
}

.horizontal-scroll{
  display:flex;
  gap:1rem;
  overflow-x:auto;
}

/* POPULAR */
.popular-card{
  min-width:420px;
  border-radius:18px;
  overflow:hidden;
  background:white;
}

.popular-card img{
  width:100%;
  height:280px;
  object-fit:cover;
}

/* RESPONSIVE */
@media(max-width:700px){
  nav{ display:none; }
  .hero-content h1{ font-size:2.7rem; }
}

</style>
</head>

<body>

<header>
  <div class="header-container">

    <div class="logo"></div>

    <div class="search-bar">
      <input type="text" placeholder="Search artists, artwork, styles...">
    </div>

    <nav>
      <a href="posts.html">Gallery</a>
      <a href="#">About</a>

      <!-- DROPDOWN -->
      <div class="account-wrapper">

        <div class="icon-button" id="accountButton">
          <img src="img/my-account-5.png">
        </div>

        <div class="account-menu" id="accountMenu">

          <div class="account-user" id="accountUser">
            Not Logged In
          </div>

          <a href="Acount_info.html?mode=account"
             id="viewAccountBtn"
             style="display:none;">
             View Account
          </a>

          <a href="account.html?mode=login"
             id="loginBtn">
             Log In
          </a>

          <a href="account.html?mode=signup"
             id="signupBtn">
             Sign Up
          </a>

          <button id="logoutBtn" style="display:none;">
            Logout
          </button>

        </div>
      </div>

    </nav>

  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>Welcome to<br>ArtMoots</h1>
    <p>Share Art, Meet Moots and Grow Together!</p>
  </div>
</section>

<main>

<section class="section">
  <h2 class="section-title">Most Popular</h2>
  <div class="horizontal-scroll" id="popularPosts"></div>
</section>

</main>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDMBb5n4Tyf9XLSHU_7CZ1obDlHjzrw258",
  authDomain: "database-artmoots.firebaseapp.com",
  projectId: "database-artmoots",
  storageBucket: "database-artmoots.firebasestorage.app",
  messagingSenderId: "1056886155154",
  appId: "1:1056886155154:web:0de8b27263c11571ea034b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* DROPDOWN */
const accountButton = document.getElementById("accountButton");
const accountMenu = document.getElementById("accountMenu");

accountButton.addEventListener("click", (e) => {
  e.stopPropagation();
  accountMenu.classList.toggle("show");
});

document.addEventListener("click", (e) => {
  if (!accountMenu.contains(e.target)) {
    accountMenu.classList.remove("show");
  }
});

/* FIRESTORE */
const popularContainer = document.getElementById("popularPosts");

async function loadPopularPosts(){
  const q = query(
    collection(db, "posts"),
    orderBy("likes", "desc"),
    limit(10)
  );

  const snapshot = await getDocs(q);

  snapshot.forEach(doc => {
    const data = doc.data();

    const card = document.createElement("div");
    card.className = "popular-card";

    card.innerHTML = `
      <img src="${data.image}">
      <div style="padding:1rem;">
        <h3>${data.title}</h3>
        <p>❤️ ${data.likes || 0}</p>
      </div>
    `;

    popularContainer.appendChild(card);
  });
}

loadPopularPosts();

</script>

</body>
</html>
