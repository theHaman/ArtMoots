<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ArtMoots</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* (YOUR CSS STAYS EXACTLY THE SAME — NO CHANGES NEEDED) */

:root{
  --bg:#f7f7f7;
  --text:#111;
  --purple:#caa6ff;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:"Inter",sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* HEADER */
header{
  width:100%;
  padding:1rem;
  display:flex;
  justify-content:center;
}

.header-container{
  width:100%;
  display:flex;
  align-items:center;
  gap:1rem;
}

.logo{
  width:140px;
  height:42px;
  background:#d9d9d9;
  border-radius:2px;
}

.search-bar{
  flex:1;
  height:42px;
  border:1px solid #444;
  border-radius:999px;
  background:white;
  display:flex;
  align-items:center;
  padding:0 1rem;
  gap:0.8rem;
}

.search-bar input{
  border:none;
  outline:none;
  width:100%;
  background:transparent;
}

nav{
  display:flex;
  align-items:center;
  gap:1.5rem;
  margin-left:auto;
}

nav a{
  text-decoration:none;
  color:#111;
  font-size:0.95rem;
}

/* ICON FIX */
.icon-button{
  width:36px;
  height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  position:relative;
}

.icon-button img{
  width:20px;
  height:20px;
}

/* DROPDOWN */
.account-wrapper{position:relative;}

.account-menu{
  position:absolute;
  top:50px;
  right:0;
  width:220px;
  background:white;
  border-radius:14px;
  padding:0.6rem;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  display:none;
  flex-direction:column;
  z-index:999;
}

.account-menu.show{
  display:flex;
}

.account-user{
  padding:0.8rem 1rem;
  font-size:0.9rem;
  color:#666;
  border-bottom:1px solid #eee;
  margin-bottom:0.3rem;
}

.account-menu a,
.account-menu button{
  width:100%;
  border:none;
  background:none;
  text-align:left;
  padding:0.8rem 1rem;
  border-radius:10px;
  text-decoration:none;
  color:#111;
  cursor:pointer;
}

.account-menu a:hover,
.account-menu button:hover{
  background:#f3f3f3;
}

/* HERO */
.hero{
  margin:0 1rem;
  height:380px;
  border-radius:0 0 18px 18px;
  background:linear-gradient(90deg,#dff5ff,#f6f6f6,#dff5ff);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero-content h1{
  font-size:4.5rem;
  font-weight:500;
}

.hero-buttons{display:flex;gap:1rem;}

.hero-btn{
  padding:1rem 1.4rem;
  border-radius:14px;
  text-decoration:none;
  font-weight:600;
}

.hero-btn.black{background:black;color:white;}
.hero-btn.purple{background:var(--purple);color:black;}

.notification{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
}

.notification img{width:20px;height:20px;}

</style>
</head>

<body>

<header>
  <div class="header-container">

    <div class="logo"></div>

    <div class="search-bar">
      <img src="img/search-icon-png-1.png" width="18">
      <input type="text" placeholder="Search artists, artwork, styles...">
    </div>

    <nav>
      <a href="posts.html">Gallery</a>
      <a href="#">About</a>

      <!-- ACCOUNT -->
      <div class="account-wrapper">

        <div class="icon-button" id="accountButton">
          <img src="img/my-account-5.png">
        </div>

        <div class="account-menu" id="accountMenu">

          <div class="account-user" id="accountUser">
            Not Logged In
          </div>

          <!-- ✅ FIXED LINKS -->
          <a href="account.html?mode=login">Log In</a>
          <a href="account.html?mode=signup">Sign Up</a>

          <a href="Acount_info.html?mode=account"
             id="viewAccountBtn"
             style="display:none;">
             View Account
          </a>

          <button id="logoutBtn" style="display:none;">
            Logout
          </button>

        </div>
      </div>

      <div class="notification">
        <img src="img/notif.png">
      </div>

    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Welcome to<br>ArtMoots</h1>
    <p>Share Art, Meet Moots and Grow Together!</p>
  </div>
</section>

<script type="module">

/* DROPDOWN */
const accountButton = document.getElementById("accountButton");
const accountMenu = document.getElementById("accountMenu");

accountButton.addEventListener("click", (e) => {
  e.stopPropagation();
  accountMenu.classList.toggle("show");
});

document.addEventListener("click", (e) => {
  if (!accountMenu.contains(e.target) && !accountButton.contains(e.target)) {
    accountMenu.classList.remove("show");
  }
});

/* USER STATE */
const currentUser = localStorage.getItem("currentUser");

const accountUser = document.getElementById("accountUser");
const logoutBtn = document.getElementById("logoutBtn");
const viewAccountBtn = document.getElementById("viewAccountBtn");

if(currentUser){
  accountUser.textContent = currentUser;
  logoutBtn.style.display = "block";
  viewAccountBtn.style.display = "block";
}

logoutBtn.addEventListener("click", () => {
  localStorage.removeItem("currentUser");
  location.reload();
});

</script>

</body>
</html>
