<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ArtMoots</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#f7f7f7;
  --text:#111;
  --muted:#666;
  --purple:#caa6ff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Inter",sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* =========================
   HEADER
========================= */

header{
  width:100%;
  padding:1rem;
  display:flex;
  justify-content:center;
}

.header-container{
  width:100%;
  display:flex;
  align-items:center;
  gap:1rem;
}

/* LOGO */

.logo{
  width:140px;
  height:42px;
  background:#d9d9d9;
  border-radius:2px;
  flex-shrink:0;
}

/* SEARCH */

.search-bar{
  flex:1;
  height:42px;
  border:1px solid #444;
  border-radius:999px;
  background:white;
  display:flex;
  align-items:center;
  padding:0 1rem;
  gap:0.8rem;
}

.search-bar input{
  border:none;
  outline:none;
  width:100%;
  background:transparent;
  font-size:1rem;
}

.search-icon img{
  width:18px;
  height:18px;
  object-fit:contain;
}

/* NAV */

nav{
  display:flex;
  align-items:center;
  gap:1.5rem;
  margin-left:auto;
}

nav a{
  text-decoration:none;
  color:#111;
  font-size:0.95rem;
  font-weight:500;
}

/* ICONS */

.icon-button{
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:0.2s;
  position:relative;
}

.icon-button:hover{
  background:#ececec;
}

.icon-button img{
  width:22px;
  height:22px;
  object-fit:contain;
}

/* =========================
    MENU
========================= */

.-wrapper{
  position:relative;
}

.-menu{
  position:absolute;
  top:55px;
  right:0;

  width:220px;

  background:white;

  border-radius:18px;

  padding:0.6rem;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.08);

  display:none;

  flex-direction:column;

  z-index:999;
}

.account-menu.show{
  display:flex;
}

.account-menu a,
.account-menu button{

  width:100%;

  border:none;
  background:none;

  text-align:left;

  padding:0.9rem 1rem;

  border-radius:12px;

  text-decoration:none;

  color:#111;

  font-size:0.95rem;

  cursor:pointer;

  font-family:inherit;
}

.account-menu a:hover,
.account-menu button:hover{
  background:#f3f3f3;
}

.account-user{
  padding:0.9rem 1rem;
  font-size:0.9rem;
  color:#666;
  border-bottom:1px solid #eee;
  margin-bottom:0.3rem;
}

/* =========================
   HERO
========================= */

.hero{
  margin:0 1rem;
  height:380px;
  border-radius:0 0 18px 18px;

  background:
    linear-gradient(
      90deg,
      #dff5ff 0%,
      #f6f6f6 30%,
      #f6f6f6 70%,
      #dff5ff 100%
    );

  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
}

.hero-content h1{
  font-size:5rem;
  line-height:0.95;
  font-weight:500;
  margin-bottom:1rem;
}

.hero-content p{
  color:#444;
  font-size:1rem;
  margin-bottom:1.8rem;
}

.hero-buttons{
  display:flex;
  justify-content:center;
  gap:1rem;
}

.hero-btn{
  text-decoration:none;
  padding:1rem 1.4rem;
  border-radius:14px;
  font-weight:600;
  transition:0.2s;
}

.hero-btn:hover{
  transform:translateY(-2px);
}

.hero-btn.black{
  background:black;
  color:white;
}

.hero-btn.purple{
  background:var(--purple);
  color:black;
}

/* =========================
   MAIN CONTENT
========================= */

main{
  padding:2rem 1rem 5rem;
}

/* SECTION */

.section{
  margin-top:2rem;
}

.section-title{
  font-size:1.4rem;
  font-weight:700;
  margin-bottom:1.5rem;
}

/* HORIZONTAL SCROLL */

.horizontal-scroll{
  display:flex;
  gap:1rem;
  overflow-x:auto;
  padding-bottom:0.5rem;
  scrollbar-width:none;
}

.horizontal-scroll::-webkit-scrollbar{
  display:none;
}

/* =========================
   ARTIST CARDS
========================= */

.artist-card{
  min-width:260px;
  border-radius:16px;
  overflow:hidden;
  background:white;
  flex-shrink:0;
}

.artist-image{
  height:150px;
  background:#d2d2d2;
}

.artist-info{
  padding:1rem;
}

.artist-row{
  display:flex;
  align-items:center;
  gap:0.8rem;
}

.artist-avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#c9c9c9;
}

.artist-lines{
  flex:1;
}

.artist-line{
  height:8px;
  background:#d7d7d7;
  border-radius:999px;
  margin-bottom:0.5rem;
}

.artist-line.small{
  width:70%;
}

/* =========================
   POPULAR POSTS
========================= */

.popular-card{
  min-width:420px;
  border-radius:18px;
  overflow:hidden;
  background:white;
  flex-shrink:0;
}

.popular-card img{
  width:100%;
  height:280px;
  object-fit:cover;
  display:block;
}

.popular-info{
  padding:1rem;
}

.popular-info h3{
  margin-bottom:0.5rem;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

  .hero-content h1{
    font-size:3.5rem;
  }

}

@media(max-width:700px){

  nav{
    display:none;
  }

  .logo{
    width:90px;
  }

  .hero{
    height:320px;
  }

  .hero-content h1{
    font-size:2.7rem;
  }

  .hero-buttons{
    flex-direction:column;
  }

  .popular-card{
    min-width:300px;
  }

}

</style>
</head>
<body>

<!-- HEADER -->

<header>

  <div class="header-container">

    <div class="logo"></div>

    <div class="search-bar">

      <div class="search-icon">
        <img src="img/search-icon-png-1.png">
      </div>

      <input
        type="text"
        placeholder="Search artists, artwork, styles..."
      >

    </div>

    <nav>

      <a href="posts.html">
        Gallery
      </a>

      <a href="#">
        About
      </a>

      <!-- ACCOUNT DROPDOWN -->

      <div class="account-wrapper">

        <div class="icon-button"
             id="accountButton">

          <img src="img/my-account-5.png">

        </div>

        <div class="account-menu"
             id="accountMenu">

          <div class="account-user"
               id="accountUser">
            Not Logged In
          </div>

          <a href="Acount_info.html?mode=account"
             id="viewAccountBtn"
             style="display:none;">
             View Account
          </a>

          <a href="account.html?mode=login"
             id="loginBtn">
             Log In
          </a>

          <a href="account.html?mode=signup"
             id="signupBtn">
             Sign Up
          </a>

          <button id="logoutBtn"
                  style="display:none;">
            Logout
          </button>

        </div>

      </div>

      <!-- NOTIFICATION -->

      <div class="icon-button">

        <img src="img/notif.png">

      </div>

    </nav>

  </div>

</header>

<!-- HERO -->

<section class="hero">

  <div class="hero-content">

    <h1>
      Welcome to<br>
      ArtMoots
    </h1>

    <p>
      Share Art, Meet Moots and Grow Together!
    </p>

    <div class="hero-buttons">

      <a href="#"
         class="hero-btn black">

         Want to know more?

      </a>

      <a href="posts.html"
         class="hero-btn purple">

         Lets see some art!

      </a>

    </div>

  </div>

</section>

<!-- MAIN -->

<main>

  <!-- TOP ARTISTS -->

  <section class="section">

    <h2 class="section-title">
      Top Artists
    </h2>

    <div class="horizontal-scroll">

      <div class="artist-card">

        <div class="artist-image"></div>

        <div class="artist-info">

          <div class="artist-row">

            <div class="artist-avatar"></div>

            <div class="artist-lines">

              <div class="artist-line"></div>

              <div class="artist-line small"></div>

            </div>

          </div>

        </div>

      </div>

    </div>

  </section>

  <!-- MOST POPULAR -->

  <section class="section">

    <h2 class="section-title">
      Most Popular
    </h2>

    <div class="horizontal-scroll"
         id="popularPosts">

    </div>

  </section>

</main>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy,
  limit
}
from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey: "AIzaSyDMBb5n4Tyf9XLSHU_7CZ1obDlHjzrw258",

  authDomain: "database-artmoots.firebaseapp.com",

  projectId: "database-artmoots",

  storageBucket: "database-artmoots.firebasestorage.app",

  messagingSenderId: "1056886155154",

  appId: "1:1056886155154:web:0de8b27263c11571ea034b"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

/* =========================
   ACCOUNT MENU
========================= */

const currentUser =
  localStorage.getItem("currentUser");

const accountButton =
  document.getElementById("accountButton");

const accountMenu =
  document.getElementById("accountMenu");

const accountUser =
  document.getElementById("accountUser");

const loginBtn =
  document.getElementById("loginBtn");

const signupBtn =
  document.getElementById("signupBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const viewAccountBtn =
  document.getElementById("viewAccountBtn");

/* TOGGLE MENU */

accountButton.addEventListener("click", () => {

  accountMenu.classList.toggle("show");

});

/* CLOSE WHEN CLICK OUTSIDE */

document.addEventListener("click", (e) => {

  if(
    !accountButton.contains(e.target) &&
    !accountMenu.contains(e.target)
  ){
    accountMenu.classList.remove("show");
  }

});

/* USER STATE */

if(currentUser){

  accountUser.textContent =
    currentUser;

  loginBtn.style.display =
    "none";

  signupBtn.style.display =
    "none";

  logoutBtn.style.display =
    "block";

  viewAccountBtn.style.display =
    "block";

}
else{

  accountUser.textContent =
    "Not Logged In";

}

/* LOGOUT */

logoutBtn.addEventListener("click", () => {

  localStorage.removeItem("currentUser");

  location.reload();

});

/* =========================
   LOAD MOST POPULAR POSTS
========================= */

const popularContainer =
  document.getElementById("popularPosts");

async function loadPopularPosts(){

  const q = query(
    collection(db, "posts"),
    orderBy("likes", "desc"),
    limit(10)
  );

  const snapshot = await getDocs(q);

  snapshot.forEach(doc => {

    const data = doc.data();

    const card = document.createElement("div");

    card.className = "popular-card";

    card.innerHTML = `

      <img src="${data.image}">

      <div class="popular-info">

        <h3>${data.title}</h3>

        <p>❤️ ${data.likes || 0}</p>

      </div>

    `;

    popularContainer.appendChild(card);

  });

}

loadPopularPosts();

</script>

</body>
</html>
