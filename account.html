<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ArtMoots - Account</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#f7f7f7;
  --text:#111;
  --muted:#666;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Inter",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem;
}

.card{
  width:100%;
  max-width:520px;
  background:white;
  border-radius:28px;
  padding:2rem;
  box-shadow:0 20px 40px rgba(0,0,0,0.08);
}

.title{
  text-align:center;
  margin-bottom:2rem;
}

form{
  display:flex;
  flex-direction:column;
  gap:1rem;
}

input, textarea{
  width:100%;
  border:none;
  background:#f2f2f2;
  padding:1rem;
  border-radius:16px;
  font-family:inherit;
}

button{
  border:none;
  background:#111;
  color:white;
  padding:1rem;
  border-radius:16px;
  font-weight:600;
  cursor:pointer;
}

.toggle{
  text-align:center;
  color:#555;
  cursor:pointer;
}

.hidden{ display:none; }

</style>

</head>

<body>

<div class="card">

  <div class="title">
    <h1>ArtMoots</h1>
    <p>Login or Create Account</p>
  </div>

  <!-- SIGN UP -->
  <form id="signupForm">

    <input type="text" id="signupName" placeholder="Username" required>
    <textarea id="signupBio" placeholder="Bio"></textarea>

    <input type="email" id="signupEmail" placeholder="Email" required>
    <input type="password" id="signupPassword" placeholder="Password" required>

    <button type="submit">Create Account</button>

    <div class="toggle" onclick="showLogin()">
      Already have an account? Log In
    </div>

  </form>

  <!-- LOGIN -->
  <form id="loginForm" class="hidden">

    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Password" required>

    <button type="submit">Log In</button>

    <div class="toggle" onclick="showSignup()">
      Don't have an account? Sign Up
    </div>

  </form>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  updateProfile,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

/* FIREBASE */
const app = initializeApp({
  apiKey: "AIzaSyDMBb5n4Tyf9XLSHU_7CZ1obDlHjzrw258",
  authDomain: "database-artmoots.firebaseapp.com",
  projectId: "database-artmoots"
});

const auth = getAuth(app);
const db = getFirestore(app);

/* ELEMENTS */
const signupForm = document.getElementById("signupForm");
const loginForm = document.getElementById("loginForm");

/* SWITCH UI */
window.showLogin = () => {
  signupForm.classList.add("hidden");
  loginForm.classList.remove("hidden");
};

window.showSignup = () => {
  loginForm.classList.add("hidden");
  signupForm.classList.remove("hidden");
};

/* =========================
   SIGN UP
========================= */
signupForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("signupName").value;
  const bio = document.getElementById("signupBio").value;
  const email = document.getElementById("signupEmail").value;
  const password = document.getElementById("signupPassword").value;

  try {
    const cred = await createUserWithEmailAndPassword(auth, email, password);

    await updateProfile(cred.user, {
      displayName: name
    });

    await setDoc(doc(db, "users", cred.user.uid), {
      uid: cred.user.uid,
      name,
      email,
      bio,
      followers: 0,
      following: 0
    });

    // IMPORTANT: use Firebase auth, not localStorage
    window.location.href = "index.html";

  } catch (err) {
    alert(err.message);
  }
});

/* =========================
   LOGIN (FIXED PROPERLY)
========================= */
loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);

    // DO NOT use fake localStorage user names anymore
    localStorage.setItem("uid", cred.user.uid);

    // force correct state reload
    window.location.href = "index.html";

  } catch (err) {
    alert("Login failed: " + err.message);
  }
});

/* =========================
   GLOBAL AUTH CHECK
   (THIS IS WHAT FIXES “NOTHING CHANGES”)
========================= */
onAuthStateChanged(auth, async (user) => {
  if (user) {
    localStorage.setItem("uid", user.uid);
  } else {
    localStorage.removeItem("uid");
  }
});

</script>

</body>
</html>
