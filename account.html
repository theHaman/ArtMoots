<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
  ArtMoots - Account
</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<style>

/* =========================
   ROOT
========================= */

:root{
  --bg:#f7f7f7;
  --text:#111;
  --muted:#666;
}

/* =========================
   GLOBAL
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Inter",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem;
}

/* =========================
   CARD
========================= */

.card{
  width:100%;
  max-width:520px;
  background:white;
  border-radius:28px;
  padding:2rem;
  box-shadow:0 20px 40px rgba(0,0,0,0.08);
}

/* =========================
   TITLE
========================= */

.title{
  text-align:center;
  margin-bottom:2rem;
}

.title h1{
  font-size:2.4rem;
  margin-bottom:0.5rem;
}

.title p{
  color:var(--muted);
}

/* =========================
   FORMS
========================= */

form{
  display:flex;
  flex-direction:column;
  gap:1rem;
}

input,
textarea{
  width:100%;
  border:none;
  background:#f2f2f2;
  padding:1rem;
  border-radius:16px;
  font-family:inherit;
  font-size:1rem;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
textarea:focus{
  outline:none;
  background:#ececec;
}

/* =========================
   UPLOADS
========================= */

.upload-box{
  background:#f2f2f2;
  border-radius:18px;
  padding:1rem;
}

.upload-box label{
  display:block;
  margin-bottom:0.6rem;
  font-weight:600;
}

.preview{
  width:100%;
  height:170px;
  background:#ddd;
  border-radius:16px;
  overflow:hidden;
  margin-bottom:1rem;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.pfp-preview{
  width:120px;
  height:120px;
  border-radius:50%;
  overflow:hidden;
  margin:0 auto 1rem;
  background:#ddd;
}

.pfp-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* =========================
   BUTTONS
========================= */

button{
  border:none;
  background:#111;
  color:white;
  padding:1rem;
  border-radius:16px;
  cursor:pointer;
  font-size:1rem;
  font-weight:600;
}

button:hover{
  background:#333;
}

/* =========================
   TOGGLE
========================= */

.toggle{
  text-align:center;
  color:#555;
  margin-top:1rem;
  cursor:pointer;
}

.toggle:hover{
  color:#111;
}

/* =========================
   ACCOUNT VIEW
========================= */

#accountView{
  display:none;
}

.profile-banner{
  width:100%;
  height:180px;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:1rem;
  background:#ddd;
}

.profile-banner img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-pfp{
  width:120px;
  height:120px;
  border-radius:50%;
  overflow:hidden;
  margin:-70px auto 1rem;
  border:5px solid white;
  background:#ddd;
}

.profile-pfp img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  text-align:center;
  font-size:1.5rem;
  font-weight:700;
}

.profile-email{
  text-align:center;
  color:#666;
  margin-top:0.5rem;
  margin-bottom:1rem;
}

.profile-bio{
  text-align:center;
  line-height:1.7;
  color:#444;
  margin-bottom:1.5rem;
}

.hidden{
  display:none;
}

</style>

</head>

<body>

<div class="card">

  <div class="title">

    <h1>ArtMoots</h1>

    <p>
      Create your artist profile
    </p>

  </div>

  <!-- SIGN UP -->

  <form id="signupForm">

    <div class="upload-box">

      <label>
        Profile Picture
      </label>

      <div class="pfp-preview">

        <img id="pfpPreview"
             src="https://placehold.co/200x200">

      </div>

      <input type="file"
             id="pfpInput"
             accept="image/*">

    </div>

    <div class="upload-box">

      <label>
        Banner Image
      </label>

      <div class="preview">

        <img id="bannerPreview"
             src="https://placehold.co/1000x400">

      </div>

      <input type="file"
             id="bannerInput"
             accept="image/*">

    </div>

    <input type="text"
           id="signupName"
           placeholder="Username"
           required>

    <textarea id="signupBio"
              placeholder="Write a short bio"></textarea>

    <input type="email"
           id="signupEmail"
           placeholder="Email"
           required>

    <input type="password"
           id="signupPassword"
           placeholder="Password"
           required>

    <button type="submit">
      Create Account
    </button>

    <div class="toggle"
         onclick="showLogin()">

      Already have an account? Log In

    </div>

  </form>

  <!-- LOGIN -->

  <form id="loginForm"
        class="hidden">

    <input type="email"
           id="loginEmail"
           placeholder="Email"
           required>

    <input type="password"
           id="loginPassword"
           placeholder="Password"
           required>

    <button type="submit">
      Log In
    </button>

    <div class="toggle"
         onclick="showSignup()">

      Don't have an account? Sign Up

    </div>

  </form>

  <!-- ACCOUNT VIEW -->

  <div id="accountView">

    <div class="profile-banner">

      <img id="viewBanner"
           src="https://placehold.co/1000x400">

    </div>

    <div class="profile-pfp">

      <img id="viewPfp"
           src="https://placehold.co/200x200">

    </div>

    <div class="profile-name"
         id="viewName">
    </div>

    <div class="profile-email"
         id="viewEmail">
    </div>

    <div class="profile-bio"
         id="viewBio">
    </div>

    <button id="logoutBtn"
            style="width:100%;">

      Logout

    </button>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";

import {

  getAuth,

  createUserWithEmailAndPassword,

  signInWithEmailAndPassword,

  signOut,

  onAuthStateChanged,

  updateProfile

}
from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

import {

  getFirestore,

  doc,

  setDoc,

  getDoc

}
from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey: "AIzaSyDMBb5n4Tyf9XLSHU_7CZ1obDlHjzrw258",

  authDomain: "database-artmoots.firebaseapp.com",

  projectId: "database-artmoots",

  storageBucket: "database-artmoots.firebasestorage.app",

  messagingSenderId: "1056886155154",

  appId: "1:1056886155154:web:0de8b27263c11571ea034b"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

/* =========================
   ELEMENTS
========================= */

const signupForm =
  document.getElementById("signupForm");

const loginForm =
  document.getElementById("loginForm");

const accountView =
  document.getElementById("accountView");

const pfpInput =
  document.getElementById("pfpInput");

const bannerInput =
  document.getElementById("bannerInput");

const pfpPreview =
  document.getElementById("pfpPreview");

const bannerPreview =
  document.getElementById("bannerPreview");

/* =========================
   IMAGE STORAGE
========================= */

let pfpData = "";
let bannerData = "";

function fileToBase64(file){

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });

}

/* =========================
   PREVIEW IMAGES
========================= */

pfpInput.addEventListener("change", async () => {

  const file = pfpInput.files[0];

  if(!file) return;

  pfpData = await fileToBase64(file);

  pfpPreview.src = pfpData;

});

bannerInput.addEventListener("change", async () => {

  const file = bannerInput.files[0];

  if(!file) return;

  bannerData = await fileToBase64(file);

  bannerPreview.src = bannerData;

});

/* =========================
   URL PARAMS
========================= */

const params =
  new URLSearchParams(window.location.search);

const returnPage =
  params.get("return") || "index.html";

/* =========================
   FORM SWITCHING
========================= */

window.showLogin = function(){

  signupForm.classList.add("hidden");

  loginForm.classList.remove("hidden");

}

window.showSignup = function(){

  loginForm.classList.add("hidden");

  signupForm.classList.remove("hidden");

}

/* =========================
   SIGN UP
========================= */

signupForm.addEventListener("submit",
async e => {

  e.preventDefault();

  const name =
    document.getElementById("signupName").value;

  const bio =
    document.getElementById("signupBio").value;

  const email =
    document.getElementById("signupEmail").value;

  const password =
    document.getElementById("signupPassword").value;

  try{

    const cred =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    await updateProfile(cred.user,{

      displayName:name

    });

    await setDoc(
      doc(db,"users",cred.user.uid),
      {

        uid:cred.user.uid,

        name:name,

        email:email,

        bio:bio,

        pfp:pfpData,

        banner:bannerData,

        followers:0,

        following:0

      }
    );

    localStorage.setItem(
      "currentUser",
      name
    );

    window.location.href =
      returnPage;

  }

  catch(error){

    alert(error.message);

  }

});

/* =========================
   LOGIN
========================= */

loginForm.addEventListener("submit",
async e => {

  e.preventDefault();

  const email =
    document.getElementById("loginEmail").value;

  const password =
    document.getElementById("loginPassword").value;

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    window.location.href =
      returnPage;

  }

  catch(error){

    alert(error.message);

  }

});

/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth, async user => {

  /* ONLY show profile page
     if URL has ?mode=account
  */

  const params =
    new URLSearchParams(window.location.search);

  const mode =
    params.get("mode");

  if(user && mode === "account"){

    signupForm.classList.add("hidden");

    loginForm.classList.add("hidden");

    accountView.style.display = "block";

    const userDoc =
      await getDoc(
        doc(db,"users",user.uid)
      );

    if(userDoc.exists()){

      const data =
        userDoc.data();

      document.getElementById("viewName")
        .textContent = data.name;

      document.getElementById("viewEmail")
        .textContent = data.email;

      document.getElementById("viewBio")
        .textContent = data.bio || "";

      if(data.pfp){

        document.getElementById("viewPfp")
          .src = data.pfp;

      }

      if(data.banner){

        document.getElementById("viewBanner")
          .src = data.banner;

      }

    }

  }

  else{

    /* NORMAL LOGIN/SIGNUP PAGE */

    accountView.style.display = "none";

    if(mode === "login"){

      showLogin();

    }

    else{

      showSignup();

    }

  }

});
/* =========================
   LOGOUT
========================= */

document.getElementById("logoutBtn")
.addEventListener("click",
async () => {

  await signOut(auth);

  localStorage.removeItem(
    "currentUser"
  );

  location.reload();

});

</script>

</body>
</html>
