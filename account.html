<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArtMoots Auth</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:Inter;
  background:#f7f7f7;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card{
  width:420px;
  background:white;
  padding:2rem;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

input,textarea{
  width:100%;
  padding:1rem;
  margin-top:0.7rem;
  border:none;
  background:#eee;
  border-radius:12px;
}

button{
  width:100%;
  margin-top:1rem;
  padding:1rem;
  border:none;
  border-radius:12px;
  background:black;
  color:white;
  font-weight:600;
  cursor:pointer;
}

.hidden{display:none;}

.switch{
  margin-top:1rem;
  text-align:center;
  cursor:pointer;
  color:#555;
}
</style>
</head>

<body>

<div class="card">

  <!-- SIGN UP -->
  <form id="signup">
    <h2>Create Account</h2>

    <input id="name" placeholder="Username" required>
    <textarea id="bio" placeholder="Bio"></textarea>
    <input id="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password" required>

    <button>Create Account</button>

    <div class="switch" onclick="showLogin()">Already have an account?</div>
  </form>

  <!-- LOGIN -->
  <form id="login" class="hidden">
    <h2>Login</h2>

    <input id="loginEmail" placeholder="Email" required>
    <input id="loginPassword" type="password" placeholder="Password" required>

    <button>Login</button>

    <div class="switch" onclick="showSignup()">Create account</div>
  </form>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  updateProfile
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

/* FIREBASE */
const app = initializeApp({
  apiKey: "AIzaSyDMBb5n4Tyf9XLSHU_7CZ1obDlHjzrw258",
  authDomain: "database-artmoots.firebaseapp.com",
  projectId: "database-artmoots"
});

const auth = getAuth(app);
const db = getFirestore(app);

/* UI SWITCH */
window.showLogin = () => {
  signup.classList.add("hidden");
  login.classList.remove("hidden");
};

window.showSignup = () => {
  login.classList.add("hidden");
  signup.classList.remove("hidden");
};

/* ELEMENTS */
const signup = document.getElementById("signup");
const login = document.getElementById("login");

/* =========================
   SIGNUP (REAL FLOW)
========================= */
signup.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("name").value;
  const bio = document.getElementById("bio").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {

    const cred = await createUserWithEmailAndPassword(auth, email, password);

    await updateProfile(cred.user, {
      displayName: name
    });

    await setDoc(doc(db, "users", cred.user.uid), {
      uid: cred.user.uid,
      name,
      bio,
      email
    });

    // Firebase now holds session automatically
    window.location.href = "index.html";

  } catch (err) {
    alert(err.message);
  }
});

/* =========================
   LOGIN (REAL FIX)
========================= */
login.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  try {

    const cred = await signInWithEmailAndPassword(auth, email, password);

    // IMPORTANT: no fake storage, Firebase handles session
    window.location.href = "index.html";

  } catch (err) {
    alert(err.message);
  }
});

/* =========================
   SESSION LISTENER (CRITICAL)
========================= */
onAuthStateChanged(auth, async (user) => {
  if (!user) return;

  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);

  if (snap.exists()) {
    console.log("User loaded:", snap.data());
  }
});

</script>

</body>
</html>
