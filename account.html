<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
  ArtMoots - Account
</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<style>

/* =========================
   ROOT
========================= */

:root{

  --bg:#f7f7f7;

  --text:#111;

  --muted:#666;

}

/* =========================
   GLOBAL
========================= */

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}

body{

  font-family:"Inter",sans-serif;

  background:var(--bg);

  color:var(--text);

  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:2rem;

  overflow:hidden;

}

/* =========================
   BACKGROUND
========================= */

.background-circle{

  position:fixed;

  border-radius:50%;

  filter:blur(80px);

  z-index:-1;

}

.circle1{

  width:500px;

  height:500px;

  background:#dff5ff;

  top:-120px;

  left:-120px;

}

.circle2{

  width:400px;

  height:400px;

  background:#f0d9ff;

  bottom:-100px;

  right:-100px;

}

/* =========================
   CONTAINER
========================= */

.auth-container{

  width:100%;

  max-width:420px;

}

/* =========================
   CARD
========================= */

.card{

  background:white;

  border-radius:30px;

  padding:2.5rem;

  box-shadow:
    0 20px 50px rgba(0,0,0,0.08);

  backdrop-filter:blur(10px);

}

/* =========================
   BRAND
========================= */

.brand{

  text-align:center;

  margin-bottom:2rem;

}

.brand h1{

  font-size:2.4rem;

  margin-bottom:0.5rem;

}

.brand p{

  color:var(--muted);

  line-height:1.7;

}

/* =========================
   FORMS
========================= */

form{

  display:flex;

  flex-direction:column;

  gap:1rem;

}

input{

  width:100%;

  padding:1rem 1.1rem;

  border:none;

  border-radius:16px;

  background:#f2f2f2;

  font-size:1rem;

  font-family:inherit;

  transition:0.2s;

}

input:focus{

  outline:none;

  background:#ececec;

}

/* =========================
   BUTTONS
========================= */

button{

  border:none;

  background:#111;

  color:white;

  padding:1rem;

  border-radius:16px;

  font-size:1rem;

  font-weight:600;

  cursor:pointer;

  transition:0.2s;

}

button:hover{

  transform:translateY(-2px);

}

/* =========================
   TOGGLE
========================= */

.toggle{

  text-align:center;

  margin-top:1rem;

  color:#555;

  cursor:pointer;

  font-size:0.95rem;

}

.toggle:hover{

  color:#111;

}

/* =========================
   ACCOUNT INFO
========================= */

#accountInfo{

  display:none;

  text-align:center;

}

.profile-picture{

  width:100px;

  height:100px;

  border-radius:50%;

  background:#ececec;

  margin:0 auto 1rem;

  overflow:hidden;

}

.profile-picture img{

  width:100%;

  height:100%;

  object-fit:cover;

}

.account-name{

  font-size:1.4rem;

  font-weight:600;

  margin-bottom:0.5rem;

}

.account-email{

  color:#666;

  margin-bottom:1.5rem;

}

/* =========================
   EXTRA BUTTONS
========================= */

.secondary-btn{

  display:block;

  text-decoration:none;

  text-align:center;

  background:#f2f2f2;

  color:#111;

  padding:1rem;

  border-radius:16px;

  margin-top:1rem;

  font-weight:500;

}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:500px){

  .card{

    padding:2rem 1.5rem;

  }

}

</style>

</head>

<body>

<!-- BACKGROUND -->

<div class="background-circle circle1"></div>

<div class="background-circle circle2"></div>

<!-- CONTAINER -->

<div class="auth-container">

  <div class="card">

    <!-- BRAND -->

    <div class="brand">

      <h1>
        ArtMoots
      </h1>

      <p>
        Connect with artists, share artwork,
        and discover inspiration.
      </p>

    </div>

    <!-- SIGN UP -->

    <form id="signupForm">

      <input type="text"
             id="signupName"
             placeholder="Full Name"
             required>

      <input type="email"
             id="signupEmail"
             placeholder="Email"
             required>

      <input type="password"
             id="signupPassword"
             placeholder="Password"
             required>

      <button type="submit">

        Create Account

      </button>

      <div class="toggle"
           onclick="showLogin()">

        Already have an account? Log In

      </div>

    </form>

    <!-- LOGIN -->

    <form id="loginForm"
          style="display:none;">

      <input type="email"
             id="loginEmail"
             placeholder="Email"
             required>

      <input type="password"
             id="loginPassword"
             placeholder="Password"
             required>

      <button type="submit">

        Log In

      </button>

      <div class="toggle"
           onclick="showSignup()">

        Don't have an account? Sign Up

      </div>

    </form>

    <!-- ACCOUNT -->

    <div id="accountInfo">

      <div class="profile-picture">

        <img id="profileImage"
             src="img/default-pfp.png">

      </div>

      <div class="account-name"
           id="accountName">

      </div>

      <div class="account-email"
           id="accountEmail">

      </div>

      <a href="Acount_info.html"
         class="secondary-btn">

        View Full Profile

      </a>

      <button id="logoutBtn"
              style="margin-top:1rem; width:100%;">

        Logout

      </button>

    </div>

  </div>

</div>

<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";

import {

  getAuth,

  createUserWithEmailAndPassword,

  signInWithEmailAndPassword,

  signOut,

  onAuthStateChanged,

  updateProfile

}
from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

import {

  getFirestore,

  doc,

  setDoc,

  getDoc

}
from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey: "AIzaSyDMBb5n4Tyf9XLSHU_7CZ1obDlHjzrw258",

  authDomain: "database-artmoots.firebaseapp.com",

  projectId: "database-artmoots",

  storageBucket: "database-artmoots.firebasestorage.app",

  messagingSenderId: "1056886155154",

  appId: "1:1056886155154:web:0de8b27263c11571ea034b"

};

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

/* =========================
   ELEMENTS
========================= */

const signupForm =
  document.getElementById("signupForm");

const loginForm =
  document.getElementById("loginForm");

const accountInfo =
  document.getElementById("accountInfo");

const logoutBtn =
  document.getElementById("logoutBtn");

const accountName =
  document.getElementById("accountName");

const accountEmail =
  document.getElementById("accountEmail");

const profileImage =
  document.getElementById("profileImage");

/* =========================
   URL PARAMS
========================= */

const params =
  new URLSearchParams(window.location.search);

const mode =
  params.get("mode");

const returnPage =
  params.get("return") || "index.html";

/* =========================
   FORM SWITCHING
========================= */

window.showLogin = function(){

  signupForm.style.display = "none";

  loginForm.style.display = "flex";

}

window.showSignup = function(){

  signupForm.style.display = "flex";

  loginForm.style.display = "none";

}

/* =========================
   MODE HANDLING
========================= */

if(mode === "login"){

  showLogin();

}

if(mode === "signup"){

  showSignup();

}

/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth,
async user => {

  if(user){

    signupForm.style.display =
      "none";

    loginForm.style.display =
      "none";

    accountInfo.style.display =
      "block";

    accountName.textContent =
      user.displayName || "Artist";

    accountEmail.textContent =
      user.email;

    /* SAVE FOR HEADER SYSTEM */

    localStorage.setItem(
      "currentUser",
      user.displayName || "Artist"
    );

    /* GET USER DATA */

    const userDoc =
      await getDoc(doc(db,"users",user.uid));

    if(userDoc.exists()){

      const data =
        userDoc.data();

      if(data.profilePicture){

        profileImage.src =
          data.profilePicture;

      }

    }

  }

  else{

    accountInfo.style.display =
      "none";

    localStorage.removeItem(
      "currentUser"
    );

  }

});

/* =========================
   SIGN UP
========================= */

signupForm.addEventListener("submit",
async e => {

  e.preventDefault();

  const name =
    document.getElementById("signupName")
    .value
    .trim();

  const email =
    document.getElementById("signupEmail")
    .value
    .trim();

  const password =
    document.getElementById("signupPassword")
    .value;

  try{

    const cred =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    /* UPDATE PROFILE */

    await updateProfile(
      cred.user,
      {

        displayName:name

      }
    );

    /* SAVE USER */

    await setDoc(
      doc(db,"users",cred.user.uid),
      {

        name:name,

        email:email,

        bio:"",

        profilePicture:"",

        banner:"",

        followers:0,

        following:0

      }
    );

    localStorage.setItem(
      "currentUser",
      name
    );

    window.location.href =
      returnPage;

  }

  catch(error){

    alert(error.message);

  }

});

/* =========================
   LOGIN
========================= */

loginForm.addEventListener("submit",
async e => {

  e.preventDefault();

  const email =
    document.getElementById("loginEmail")
    .value
    .trim();

  const password =
    document.getElementById("loginPassword")
    .value;

  try{

    const cred =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    localStorage.setItem(
      "currentUser",
      cred.user.displayName || "Artist"
    );

    window.location.href =
      returnPage;

  }

  catch(error){

    alert(error.message);

  }

});

/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener("click",
async () => {

  await signOut(auth);

  localStorage.removeItem(
    "currentUser"
  );

  window.location.href =
    "index.html";

});

</script>

</body>
</html>
