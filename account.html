<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArtMoots Auth</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 2rem;
}

.card {
  width: 100%;
  max-width: 920px;
  background: white;
  padding: 3rem 2.5rem;
  border-radius: 12px;
  border: 1px solid #f0f0f0;
  box-shadow: 0 15px 45px rgba(0,0,0,0.06);
}

h2 {
  font-size: 2.2rem;
  font-weight: 500;
  color: #000000;
  margin-bottom: 1.5rem;
}

/* INPUTS & TEXTAREA */
input, textarea {
  width: 100%;
  padding: 0.9rem 1.2rem;
  margin-bottom: 0.8rem;
  border: 1px solid #111111;
  background: #ffffff;
  border-radius: 14px;
  font-size: 1rem;
  color: #111111;
  outline: none;
}

input::placeholder, textarea::placeholder {
  color: #999999;
}

textarea {
  height: 100px;
  resize: none;
  font-family: inherit;
  font-size: 0.9rem;
  line-height: 1.4;
}

/* SIGN UP BANNER & PFP CLICKABLE UPLOADERS */
.profile-preview-skeleton {
  width: 100%;
  height: 120px; /* Slightly taller to accommodate image scaling visually */
  background: #e5e5e5;
  border-radius: 16px;
  margin-bottom: 2rem;
  position: relative;
  cursor: pointer;
  background-size: cover;
  background-position: center;
  overflow: visible;
  border: 1px dashed #999;
}

.profile-preview-skeleton::after {
  content: "Click to upload Banner";
  position: absolute;
  right: 15px;
  top: 15px;
  font-size: 0.75rem;
  color: #666;
  background: rgba(255,255,255,0.7);
  padding: 2px 6px;
  border-radius: 4px;
  pointer-events: none;
}

.avatar-skeleton {
  width: 80px;
  height: 80px;
  background: #cccccc;
  border: 4px solid #ffffff;
  border-radius: 50%;
  position: absolute;
  left: 15px;
  bottom: -25px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  cursor: pointer;
  background-size: cover;
  background-position: center;
  z-index: 10;
}

/* Hidden File Inputs */
.file-input {
  display: none;
}

/* BUTTONS */
.btn-container {
  display: flex;
  justify-content: center;
  width: 100%;
  margin-top: 1.5rem;
  margin-bottom: 1.2rem;
}

button {
  width: 140px;
  padding: 0.8rem 1.5rem;
  border: none;
  border-radius: 14px;
  background: #000000;
  color: #ffffff;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s;
}

button:hover {
  opacity: 0.9;
}

.hidden {
  display: none;
}

/* REDIRECT FOOTER TEXT */
.switch {
  text-align: center;
  font-size: 1rem;
  color: #000000;
}

.switch span {
  color: #53a6ff;
  cursor: pointer;
  text-decoration: none;
}

.switch span:hover {
  text-decoration: underline;
}
</style>
</head>

<body>

<div class="card">

  <form id="signup">
    <h2>Sign Up</h2>
    
    <div class="profile-preview-skeleton" id="bannerLabel" title="Click to upload banner">
      <div class="avatar-skeleton" id="pfpLabel" title="Click to upload profile picture"></div>
    </div>

    <input type="file" id="pfpInput" class="file-input" accept="image/*">
    <input type="file" id="bannerInput" class="file-input" accept="image/*">

    <textarea id="bio" placeholder="Talk about yourself..&#10;(what do you do,&#10;what art do you make, how are you&#10;today?)"></textarea>
    <input id="name" placeholder="Username" required>
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password" required>

    <div class="btn-container">
      <button type="submit">Sign Up</button>
    </div>

    <div class="switch">Have an Account? <span onclick="showLogin()">Login!</span></div>
  </form>

  <form id="login" class="hidden">
    <h2>Login</h2>

    <input id="loginEmail" type="email" placeholder="Email" required>
    <input id="loginPassword" type="password" placeholder="Password" required>

    <div class="btn-container">
      <button type="submit">Log in</button>
    </div>

    <div class="switch">No account? <span onclick="showSignup()">make one here!</span></div>
  </form>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  updateProfile
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

/* FIREBASE INITIALIZATION */
const app = initializeApp({
  apiKey: "AIzaSyDMBb5n4Tyf9XLSHU_7CZ1obDlHjzrw258",
  authDomain: "database-artmoots.firebaseapp.com",
  projectId: "database-artmoots"
});

const auth = getAuth(app);
const db = getFirestore(app);

/* DOM ELEMENTS */
const signupForm = document.getElementById("signup");
const loginForm = document.getElementById("login");

// Custom Image Upload Node hooks
const pfpLabel = document.getElementById("pfpLabel");
const pfpInput = document.getElementById("pfpInput");
const bannerLabel = document.getElementById("bannerLabel");
const bannerInput = document.getElementById("bannerInput");

// Base64 storage placeholders
let pfpBase64 = "";
let bannerBase64 = "";

/* INTERFACE VIEW ROUTER */
window.showLogin = () => {
  signupForm.classList.add("hidden");
  loginForm.classList.remove("hidden");
};

window.showSignup = () => {
  loginForm.classList.add("hidden");
  signupForm.classList.remove("hidden");
};

/* =========================================
   IMAGE HANDLING SYSTEM (FILE -> BASE64)
========================================= */

// Trigger input files when clicking custom design elements
pfpLabel.addEventListener("click", (e) => {
  e.stopPropagation(); // Prevents clicking the avatar from clicking the banner behind it
  pfpInput.click();
});

bannerLabel.addEventListener("click", () => {
  bannerInput.click();
});

// Process PFP image file
pfpInput.addEventListener("change", function() {
  const file = this.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      pfpBase64 = e.target.result; // Data URL generated
      pfpLabel.style.backgroundImage = `url(${pfpBase64})`; // Update preview element background
    };
    reader.readAsDataURL(file);
  }
});

// Process Banner image file
bannerInput.addEventListener("change", function() {
  const file = this.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      bannerBase64 = e.target.result; // Data URL generated
      bannerLabel.style.backgroundImage = `url(${bannerBase64})`; // Update preview element background
    };
    reader.readAsDataURL(file);
  }
});


/* =========================
   SIGNUP PROCESS
========================= */
signupForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("name").value;
  const bio = document.getElementById("bio").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    const cred = await createUserWithEmailAndPassword(auth, email, password);

    await updateProfile(cred.user, {
      displayName: name
    });

    // Save user info along with the Base64 images to Firestore
    await setDoc(doc(db, "users", cred.user.uid), {
      uid: cred.user.uid,
      name,
      bio,
      email,
      pfp: pfpBase64,       // Saved as safe DataURL strings
      banner: bannerBase64, // Saved as safe DataURL strings
      followers: 0,
      following: 0
    });

    window.location.href = "index.html";
  } catch (err) {
    alert(err.message);
  }
});

/* =========================
   LOGIN PROCESS
========================= */
loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    window.location.href = "index.html";
  } catch (err) {
    alert(err.message);
  }
});

/* =========================
   ACTIVE ACCOUNT STATE LISTENER
========================= */
onAuthStateChanged(auth, async (user) => {
  if (!user) return;

  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);

  if (snap.exists()) {
    console.log("Logged in user data with image assets:", snap.data());
  }
});

</script>

</body>
</html>
