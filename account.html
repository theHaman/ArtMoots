<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
  ArtMoots - Account
</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<style>

/* =========================
   ROOT
========================= */

:root{

  --bg:#f7f7f7;
  --text:#111;
  --muted:#666;

}

/* =========================
   GLOBAL
========================= */

*{

  margin:0;
  padding:0;
  box-sizing:border-box;

}

body{

  font-family:"Inter",sans-serif;

  background:var(--bg);

  color:var(--text);

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:2rem;

  overflow-y:auto;

}

/* =========================
   BACKGROUND
========================= */

.background-circle{

  position:fixed;

  border-radius:50%;

  filter:blur(80px);

  z-index:-1;

}

.circle1{

  width:500px;
  height:500px;

  background:#dff5ff;

  top:-120px;
  left:-120px;

}

.circle2{

  width:400px;
  height:400px;

  background:#f0d9ff;

  bottom:-100px;
  right:-100px;

}

/* =========================
   CARD
========================= */

.card{

  width:100%;
  max-width:620px;

  background:white;

  border-radius:30px;

  padding:2.5rem;

  box-shadow:
    0 20px 50px rgba(0,0,0,0.08);

}

/* =========================
   BRAND
========================= */

.brand{

  text-align:center;

  margin-bottom:2rem;

}

.brand h1{

  font-size:2.5rem;

  margin-bottom:0.5rem;

}

.brand p{

  color:#666;

}

/* =========================
   FORM
========================= */

form{

  display:flex;

  flex-direction:column;

  gap:1rem;

}

input,
textarea{

  width:100%;

  border:none;

  background:#f2f2f2;

  padding:1rem;

  border-radius:16px;

  font-size:1rem;

  font-family:inherit;

}

input:focus,
textarea:focus{

  outline:none;

  background:#ececec;

}

textarea{

  resize:vertical;

  min-height:100px;

}

/* =========================
   PROFILE
========================= */

.profile-preview{

  width:120px;
  height:120px;

  border-radius:50%;

  overflow:hidden;

  margin:auto;

  cursor:pointer;

  position:relative;

  background:#f2f2f2;

}

.profile-preview img{

  width:100%;
  height:100%;

  object-fit:cover;

}

.banner-preview{

  width:100%;
  height:180px;

  border-radius:20px;

  overflow:hidden;

  cursor:pointer;

  position:relative;

  background:#f2f2f2;

}

.banner-preview img{

  width:100%;
  height:100%;

  object-fit:cover;

}

.overlay{

  position:absolute;

  inset:0;

  background:rgba(0,0,0,0.4);

  display:flex;

  align-items:center;
  justify-content:center;

  color:white;

  opacity:0;

  transition:0.2s;

}

.profile-preview:hover .overlay,
.banner-preview:hover .overlay{

  opacity:1;

}

.hidden-file{

  display:none;

}

/* =========================
   BUTTON
========================= */

button{

  border:none;

  background:#111;

  color:white;

  padding:1rem;

  border-radius:16px;

  font-size:1rem;

  font-weight:600;

  cursor:pointer;

  transition:0.2s;

}

button:hover{

  transform:translateY(-2px);

  background:#333;

}

/* =========================
   TOGGLE
========================= */

.toggle{

  text-align:center;

  color:#666;

  cursor:pointer;

}

.toggle:hover{

  text-decoration:underline;

}

/* =========================
   ACCOUNT INFO
========================= */

#accountInfo{

  display:none;

  text-align:center;

}

.account-name{

  font-size:1.4rem;

  font-weight:700;

  margin-top:1rem;

}

.account-email{

  color:#666;

  margin-top:0.5rem;

}

.status{

  padding:1rem;

  border-radius:14px;

  display:none;

}

.error{

  background:#ffeaea;

  color:#e74c3c;

}

.success{

  background:#eafaf0;

  color:#2ecc71;

}

</style>

</head>

<body>

<div class="background-circle circle1"></div>
<div class="background-circle circle2"></div>

<div class="card">

  <div class="brand">

    <h1>
      ArtMoots
    </h1>

    <p>
      Create your artist account
    </p>

  </div>

  <!-- SIGNUP -->

  <form id="signupForm">

    <!-- PFP -->

    <div class="profile-preview"
         id="profilePreview">

      <img id="profilePreviewImg"
           src="https://placehold.co/200x200?text=PFP">

      <div class="overlay">
        Upload PFP
      </div>

    </div>

    <input type="file"
           id="profilePictureInput"
           class="hidden-file"
           accept="image/*">

    <!-- BANNER -->

    <div class="banner-preview"
         id="bannerPreview">

      <img id="bannerPreviewImg"
           src="https://placehold.co/1200x400?text=Banner">

      <div class="overlay">
        Upload Banner
      </div>

    </div>

    <input type="file"
           id="bannerInput"
           class="hidden-file"
           accept="image/*">

    <!-- USERNAME -->

    <input type="text"
           id="signupName"
           placeholder="Username"
           required>

    <!-- BIO -->

    <textarea id="signupBio"
              placeholder="Bio"></textarea>

    <!-- EMAIL -->

    <input type="email"
           id="signupEmail"
           placeholder="Email"
           required>

    <!-- PASSWORD -->

    <input type="password"
           id="signupPassword"
           placeholder="Password"
           required>

    <div id="signupStatus"
         class="status"></div>

    <button type="submit">
      Create Account
    </button>

    <div class="toggle"
         onclick="showLogin()">

      Already have an account? Login

    </div>

  </form>

  <!-- LOGIN -->

  <form id="loginForm"
        style="display:none;">

    <input type="email"
           id="loginEmail"
           placeholder="Email"
           required>

    <input type="password"
           id="loginPassword"
           placeholder="Password"
           required>

    <div id="loginStatus"
         class="status"></div>

    <button type="submit">
      Log In
    </button>

    <div class="toggle"
         onclick="showSignup()">

      Don't have an account? Sign Up

    </div>

  </form>

  <!-- ACCOUNT -->

  <div id="accountInfo">

    <div class="profile-preview">

      <img id="accountPfp"
           src="https://placehold.co/200x200">

    </div>

    <div class="account-name"
         id="accountName"></div>

    <div class="account-email"
         id="accountEmail"></div>

    <button id="logoutBtn"
            style="margin-top:1.5rem;width:100%;">

      Logout

    </button>

  </div>

</div>

<script type="module">

/* =========================
   FIREBASE
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";

import {

  getAuth,

  createUserWithEmailAndPassword,

  signInWithEmailAndPassword,

  signOut,

  onAuthStateChanged,

  updateProfile

}
from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

import {

  getFirestore,

  doc,

  setDoc,

  getDoc

}
from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

/* =========================
   CONFIG
========================= */

const firebaseConfig = {

  apiKey: "AIzaSyDMBb5n4Tyf9XLSHU_7CZ1obDlHjzrw258",

  authDomain: "database-artmoots.firebaseapp.com",

  projectId: "database-artmoots",

  storageBucket: "database-artmoots.firebasestorage.app",

  messagingSenderId: "1056886155154",

  appId: "1:1056886155154:web:0de8b27263c11571ea034b"

};

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

/* =========================
   ELEMENTS
========================= */

const signupForm =
  document.getElementById("signupForm");

const loginForm =
  document.getElementById("loginForm");

const accountInfo =
  document.getElementById("accountInfo");

/* =========================
   PREVIEW VARIABLES
========================= */

let selectedProfilePicture = "";

let selectedBanner = "";

/* =========================
   PROFILE PICTURE
========================= */

const profilePreview =
  document.getElementById("profilePreview");

const profilePictureInput =
  document.getElementById("profilePictureInput");

const profilePreviewImg =
  document.getElementById("profilePreviewImg");

profilePreview.addEventListener("click",()=>{

  profilePictureInput.click();

});

profilePictureInput.addEventListener("change",e=>{

  const file = e.target.files[0];

  if(file){

    fileToBase64(file)
    .then(base64=>{

      selectedProfilePicture = base64;

      profilePreviewImg.src = base64;

    });

  }

});

/* =========================
   BANNER
========================= */

const bannerPreview =
  document.getElementById("bannerPreview");

const bannerInput =
  document.getElementById("bannerInput");

const bannerPreviewImg =
  document.getElementById("bannerPreviewImg");

bannerPreview.addEventListener("click",()=>{

  bannerInput.click();

});

bannerInput.addEventListener("change",e=>{

  const file = e.target.files[0];

  if(file){

    fileToBase64(file)
    .then(base64=>{

      selectedBanner = base64;

      bannerPreviewImg.src = base64;

    });

  }

});

/* =========================
   BASE64 FIX
========================= */

function fileToBase64(file){

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.readAsDataURL(file);

    reader.onload = () => resolve(reader.result);

    reader.onerror = error => reject(error);

  });

}

/* =========================
   URL PARAMS
========================= */

const params =
  new URLSearchParams(window.location.search);

const returnPage =
  params.get("return") || "index.html";

/* =========================
   FORM TOGGLE
========================= */

window.showLogin = function(){

  signupForm.style.display = "none";

  loginForm.style.display = "flex";

}

window.showSignup = function(){

  signupForm.style.display = "flex";

  loginForm.style.display = "none";

}

/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth,
async user=>{

  if(user){

    signupForm.style.display = "none";

    loginForm.style.display = "none";

    accountInfo.style.display = "block";

    document.getElementById("accountName")
      .textContent =
      user.displayName || "Artist";

    document.getElementById("accountEmail")
      .textContent =
      user.email;

    const userDoc =
      await getDoc(doc(db,"users",user.uid));

    if(userDoc.exists()){

      const data =
        userDoc.data();

      if(data.profilePicture){

        document.getElementById("accountPfp")
          .src =
          data.profilePicture;

      }

    }

  }

});

/* =========================
   SIGN UP
========================= */

signupForm.addEventListener("submit",
async e=>{

  e.preventDefault();

  try{

    const name =
      document.getElementById("signupName").value;

    const bio =
      document.getElementById("signupBio").value;

    const email =
      document.getElementById("signupEmail").value;

    const password =
      document.getElementById("signupPassword").value;

    const cred =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

    await updateProfile(cred.user,{

      displayName:name

    });

    /* SAVE USER */

    await setDoc(
      doc(db,"users",cred.user.uid),
      {

        uid:cred.user.uid,

        username:name,

        bio:bio,

        email:email,

        profilePicture:
          selectedProfilePicture,

        banner:
          selectedBanner,

        followers:0,

        following:0,

        createdAt:
          new Date()

      }
    );

    localStorage.setItem(
      "currentUser",
      name
    );

    window.location.href =
      returnPage;

  }

  catch(error){

    console.error(error);

    const status =
      document.getElementById("signupStatus");

    status.style.display = "block";

    status.className =
      "status error";

    status.textContent =
      error.message;

  }

});

/* =========================
   LOGIN
========================= */

loginForm.addEventListener("submit",
async e=>{

  e.preventDefault();

  try{

    const email =
      document.getElementById("loginEmail").value;

    const password =
      document.getElementById("loginPassword").value;

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    window.location.href =
      returnPage;

  }

  catch(error){

    console.error(error);

    const status =
      document.getElementById("loginStatus");

    status.style.display = "block";

    status.className =
      "status error";

    status.textContent =
      error.message;

  }

});

/* =========================
   LOGOUT
========================= */

document.getElementById("logoutBtn")
.addEventListener("click",
async()=>{

  await signOut(auth);

  localStorage.removeItem(
    "currentUser"
  );

  location.reload();

});

</script>

</body>
</html>
