<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ArtMoots - Account</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#f7f7f7;
  --text:#111;
  --muted:#666;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Inter",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem;
}

.card{
  width:100%;
  max-width:520px;
  background:white;
  border-radius:28px;
  padding:2rem;
  box-shadow:0 20px 40px rgba(0,0,0,0.08);
}

.title{
  text-align:center;
  margin-bottom:2rem;
}

form{
  display:flex;
  flex-direction:column;
  gap:1rem;
}

input,
textarea{
  width:100%;
  border:none;
  background:#f2f2f2;
  padding:1rem;
  border-radius:16px;
  font-family:inherit;
}

.upload-box{
  background:#f2f2f2;
  border-radius:18px;
  padding:1rem;
}

.preview{
  width:100%;
  height:170px;
  border-radius:16px;
  overflow:hidden;
  margin-bottom:1rem;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.pfp-preview{
  width:120px;
  height:120px;
  border-radius:50%;
  overflow:hidden;
  margin:0 auto 1rem;
}

button{
  border:none;
  background:#111;
  color:white;
  padding:1rem;
  border-radius:16px;
  font-weight:600;
  cursor:pointer;
}

.toggle{
  text-align:center;
  color:#555;
  cursor:pointer;
}

.hidden{ display:none; }

</style>

</head>

<body>

<div class="card">

  <div class="title">
    <h1>ArtMoots</h1>
    <p>Create your artist profile</p>
  </div>

  <!-- SIGN UP -->
  <form id="signupForm">

    <div class="upload-box">
      <label>Profile Picture</label>

      <div class="pfp-preview">
        <img id="pfpPreview" src="https://placehold.co/200">
      </div>

      <input type="file" id="pfpInput" accept="image/*">
    </div>

    <div class="upload-box">
      <label>Banner Image</label>

      <div class="preview">
        <img id="bannerPreview" src="https://placehold.co/1000x400">
      </div>

      <input type="file" id="bannerInput" accept="image/*">
    </div>

    <input type="text" id="signupName" placeholder="Username" required>
    <textarea id="signupBio" placeholder="Bio"></textarea>
    <input type="email" id="signupEmail" placeholder="Email" required>
    <input type="password" id="signupPassword" placeholder="Password" required>

    <button type="submit">Create Account</button>

    <div class="toggle" onclick="showLogin()">
      Already have an account? Log In
    </div>

  </form>

  <!-- LOGIN -->
  <form id="loginForm" class="hidden">

    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Password" required>

    <button type="submit">Log In</button>

    <div class="toggle" onclick="showSignup()">
      Don't have an account? Sign Up
    </div>

  </form>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  updateProfile
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

/* FIREBASE */
const app = initializeApp({
  apiKey: "AIzaSyDMBb5n4Tyf9XLSHU_7CZ1obDlHjzrw258",
  authDomain: "database-artmoots.firebaseapp.com",
  projectId: "database-artmoots"
});

const auth = getAuth(app);
const db = getFirestore(app);

/* ELEMENTS */
const signupForm = document.getElementById("signupForm");
const loginForm = document.getElementById("loginForm");

const pfpInput = document.getElementById("pfpInput");
const bannerInput = document.getElementById("bannerInput");
const pfpPreview = document.getElementById("pfpPreview");
const bannerPreview = document.getElementById("bannerPreview");

/* =========================
   HIGH QUALITY RESIZE
========================= */

function resizeImage(file, maxWidth, quality = 0.85) {
  return new Promise((resolve) => {
    const reader = new FileReader();

    reader.onload = (e) => {
      const img = new Image();

      img.onload = () => {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";

        const scale = maxWidth / img.width;

        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);

        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        resolve(canvas.toDataURL("image/jpeg", quality));
      };

      img.src = e.target.result;
    };

    reader.readAsDataURL(file);
  });
}

/* IMAGE DATA */
let pfpData = "";
let bannerData = "";

/* PREVIEW */
pfpInput.addEventListener("change", async () => {
  const file = pfpInput.files[0];
  if (!file) return;

  pfpData = await resizeImage(file, 400, 0.85);
  pfpPreview.src = pfpData;
});

bannerInput.addEventListener("change", async () => {
  const file = bannerInput.files[0];
  if (!file) return;

  bannerData = await resizeImage(file, 1600, 0.88);
  bannerPreview.src = bannerData;
});

/* TOGGLE */
window.showLogin = () => {
  signupForm.classList.add("hidden");
  loginForm.classList.remove("hidden");
};

window.showSignup = () => {
  loginForm.classList.add("hidden");
  signupForm.classList.remove("hidden");
};

/* =========================
   SIGN UP
========================= */

signupForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("signupName").value;
  const bio = document.getElementById("signupBio").value;
  const email = document.getElementById("signupEmail").value;
  const password = document.getElementById("signupPassword").value;

  try {

    const cred = await createUserWithEmailAndPassword(auth, email, password);

    await updateProfile(cred.user, { displayName: name });

    await setDoc(doc(db, "users", cred.user.uid), {
      uid: cred.user.uid,
      name,
      email,
      bio,
      pfp: pfpData,
      banner: bannerData,
      followers: 0,
      following: 0
    });

    window.location.href = "index.html";

  } catch (err) {
    alert(err.message);
  }

});

/* =========================
   LOGIN (FIXED)
========================= */

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  try {

    const cred = await signInWithEmailAndPassword(auth, email, password);

    const userRef = doc(db, "users", cred.user.uid);
    const userSnap = await getDoc(userRef);

    if (userSnap.exists()) {
      const data = userSnap.data();

      localStorage.setItem("currentUser", data.name);
      localStorage.setItem("uid", cred.user.uid);
    }

    window.location.href = "index.html";

  } catch (err) {
    alert("Login failed: " + err.message);
  }

});

</script>

</body>
</html>
